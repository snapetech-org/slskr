name: slskr
base: core22
version: '0.2.74'
summary: Rust Soulseek daemon with bundled Web UI
description: |
  slskR is a Rust Soulseek client and daemon with a local web interface.
grade: stable
confinement: strict
architectures:
  - build-on: [amd64]
    build-for: [amd64]
  - build-on: [amd64, arm64]
    build-for: [arm64]

apps:
  slskr:
    command: slskr
    daemon: simple
    plugs: [network, network-bind, home, removable-media]
    environment:
      SLSKR_CONFIG: $SNAP_USER_COMMON/config.toml

parts:
  slskr:
    plugin: dump
    source:
      - on amd64: https://github.com/snapetech-org/slskr/releases/download/release-v0.2.74/slskr-v0.2.74-x86_64-unknown-linux-gnu.tar.gz
      - on arm64: https://github.com/snapetech-org/slskr/releases/download/release-v0.2.74/slskr-v0.2.74-aarch64-unknown-linux-gnu.tar.gz
    source-type: file
    override-pull: |
      craftctl default
      case "${CRAFT_ARCH_BUILD_FOR:-${SNAPCRAFT_ARCH_BUILD_FOR:-}}" in
        amd64)
          archive="slskr-v0.2.74-x86_64-unknown-linux-gnu.tar.gz"
          expected="a9767342626ef961fede6a89296f0578809413178a7889fb8ba752b1bcf26e44"
          ;;
        arm64)
          archive="slskr-v0.2.74-aarch64-unknown-linux-gnu.tar.gz"
          expected="70e55df434fb5333e13f80e9a97cc183a033fed2416ebead458715654265e66d"
          ;;
        *)
          echo "unsupported Snap architecture: ${CRAFT_ARCH_BUILD_FOR:-${SNAPCRAFT_ARCH_BUILD_FOR:-}}" >&2
          exit 1
          ;;
      esac
      archive_path="$CRAFT_PART_SRC/$archive"
      test -f "$archive_path"
      printf '%s  %s\n' "$expected" "$archive_path" | sha256sum --check --status
      tar -xzf "$archive_path" -C "$CRAFT_PART_SRC" --strip-components=1
      rm -f "$archive_path"
