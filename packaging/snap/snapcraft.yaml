name: slskr
base: core24
version: '0.2.82'
summary: Rust Soulseek daemon with bundled Web UI
description: |
  slskR is a Rust Soulseek client and daemon with a local web interface.
grade: stable
confinement: strict
platforms:
  amd64:
    build-on: [amd64]
    build-for: [amd64]
  arm64:
    build-on: [arm64]
    build-for: [arm64]

apps:
  slskr:
    command: slskr
    daemon: simple
    plugs: [network, network-bind, home, removable-media]
    environment:
      SLSKR_CONFIG: $SNAP_USER_COMMON/config.toml

parts:
  slskr:
    plugin: dump
    source:
      - on amd64: https://github.com/snapetech-org/slskr/releases/download/v0.2.82/slskr-v0.2.82-x86_64-unknown-linux-gnu.tar.gz
      - on arm64: https://github.com/snapetech-org/slskr/releases/download/v0.2.82/slskr-v0.2.82-aarch64-unknown-linux-gnu.tar.gz
    source-type: file
    override-pull: |
      craftctl default
      case "${CRAFT_ARCH_BUILD_FOR:-${SNAPCRAFT_ARCH_BUILD_FOR:-}}" in
        amd64)
          archive="slskr-v0.2.82-x86_64-unknown-linux-gnu.tar.gz"
          expected="1be76e20557764ce99ccc63b65db35366ab187c8dcc85b966f85f11875a131a0"
          ;;
        arm64)
          archive="slskr-v0.2.82-aarch64-unknown-linux-gnu.tar.gz"
          expected="a0810ac469673dd08ccf3bc5aca40d1255055403a1ac0a1826cd2a3f9847e7b9"
          ;;
        *)
          echo "unsupported Snap architecture: ${CRAFT_ARCH_BUILD_FOR:-${SNAPCRAFT_ARCH_BUILD_FOR:-}}" >&2
          exit 1
          ;;
      esac
      archive_path="$CRAFT_PART_SRC/$archive"
      test -f "$archive_path"
      printf '%s  %s\n' "$expected" "$archive_path" | sha256sum --check --status
      tar -xzf "$archive_path" -C "$CRAFT_PART_SRC" --strip-components=1
      rm -f "$archive_path"
