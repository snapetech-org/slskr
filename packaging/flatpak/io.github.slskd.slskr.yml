app-id: io.github.slskd.slskr
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
command: slskr-wrapper

finish-args:
  - --share=network
  - --filesystem=xdg-download
  - --filesystem=xdg-music
  - --filesystem=~/.config/slskr:create
  - --filesystem=~/.local/share/slskr:create

modules:
  - name: slskr
    buildsystem: simple
    build-commands:
      - mkdir -p /app/bin /app/lib/slskr
      - cp -r . /app/lib/slskr/
      - |
        cat > /app/bin/slskr-wrapper <<'EOF'
        #!/usr/bin/env bash
        set -e
        CONFIG_DIR="${XDG_CONFIG_HOME:-$HOME/.config}/slskr"
        mkdir -p "$CONFIG_DIR"
        if [ ! -f "$CONFIG_DIR/config.toml" ]; then
          printf '%s\n' '[web]' 'port = 5030' > "$CONFIG_DIR/config.toml"
        fi
        exec /app/lib/slskr/slskr serve --config "$CONFIG_DIR/config.toml"
        EOF
      - chmod +x /app/bin/slskr-wrapper
    sources:
      - type: archive
        url: https://github.com/snapetech-org/slskr/releases/download/v0.2.83/slskr-v0.2.83-x86_64-unknown-linux-gnu.tar.gz
        sha256: 6bf49ddd5d1d910d2f79e7740ac8e41ec0af76a8378464dd0cad2a4f6b0c6cd6
        only-arches: [x86_64]
      - type: archive
        url: https://github.com/snapetech-org/slskr/releases/download/v0.2.83/slskr-v0.2.83-aarch64-unknown-linux-gnu.tar.gz
        sha256: a8e56faf27ec021a48f1410f884e0a39d23ba9c3e3043bf8ad1bbcd4eb6f4928
        only-arches: [aarch64]
