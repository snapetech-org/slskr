app-id: io.github.slskd.slskr
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
command: slskr-wrapper

finish-args:
  - --share=network
  - --filesystem=xdg-download
  - --filesystem=xdg-music
  - --filesystem=~/.config/slskr:create
  - --filesystem=~/.local/share/slskr:create

modules:
  - name: slskr
    buildsystem: simple
    build-commands:
      - mkdir -p /app/bin /app/lib/slskr
      - cp -r . /app/lib/slskr/
      - |
        cat > /app/bin/slskr-wrapper <<'EOF'
        #!/usr/bin/env bash
        set -e
        CONFIG_DIR="${XDG_CONFIG_HOME:-$HOME/.config}/slskr"
        mkdir -p "$CONFIG_DIR"
        if [ ! -f "$CONFIG_DIR/config.toml" ]; then
          printf '%s\n' '[web]' 'port = 5030' > "$CONFIG_DIR/config.toml"
        fi
        exec /app/lib/slskr/slskr serve --config "$CONFIG_DIR/config.toml"
        EOF
      - chmod +x /app/bin/slskr-wrapper
    sources:
      - type: archive
        url: https://github.com/snapetech-org/slskr/releases/download/v0.2.86/slskr-v0.2.86-x86_64-unknown-linux-gnu.tar.gz
        sha256: c9878466be8dd224baf1038fc1dc3874a3d6dd755af23d885ef19df99034a2c4
        only-arches: [x86_64]
      - type: archive
        url: https://github.com/snapetech-org/slskr/releases/download/v0.2.86/slskr-v0.2.86-aarch64-unknown-linux-gnu.tar.gz
        sha256: 6b24aad46283d50f1a33a71f90e9a708a190d30449212b167672c42683cbb5c6
        only-arches: [aarch64]
