app-id: io.github.slskd.slskr
runtime: org.freedesktop.Platform
runtime-version: '23.08'
sdk: org.freedesktop.Sdk
command: slskr-wrapper

finish-args:
  - --share=network
  - --filesystem=xdg-download
  - --filesystem=xdg-music
  - --filesystem=~/.config/slskr:create
  - --filesystem=~/.local/share/slskr:create

modules:
  - name: slskr
    buildsystem: simple
    build-commands:
      - mkdir -p /app/bin /app/lib/slskr
      - cp -r . /app/lib/slskr/
      - |
        cat > /app/bin/slskr-wrapper <<'EOF'
        #!/usr/bin/env bash
        set -e
        CONFIG_DIR="${XDG_CONFIG_HOME:-$HOME/.config}/slskr"
        mkdir -p "$CONFIG_DIR"
        if [ ! -f "$CONFIG_DIR/config.toml" ]; then
          printf '%s\n' '[web]' 'port = 5030' > "$CONFIG_DIR/config.toml"
        fi
        exec /app/lib/slskr/slskr serve --config "$CONFIG_DIR/config.toml"
        EOF
      - chmod +x /app/bin/slskr-wrapper
    sources:
      - type: archive
        url: https://github.com/snapetech-org/slskr/releases/download/release-v0.2.74/slskr-v0.2.74-x86_64-unknown-linux-gnu.tar.gz
        sha256: a9767342626ef961fede6a89296f0578809413178a7889fb8ba752b1bcf26e44
        only-arches: [x86_64]
      - type: archive
        url: https://github.com/snapetech-org/slskr/releases/download/release-v0.2.74/slskr-v0.2.74-aarch64-unknown-linux-gnu.tar.gz
        sha256: 70e55df434fb5333e13f80e9a97cc183a033fed2416ebead458715654265e66d
        only-arches: [aarch64]
