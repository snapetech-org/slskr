name: gVisor runner smoke
run-name: ${{ format('action:{0}:pool:{1}', inputs.action_tag, inputs.runner_pool_tag) }}

on:
  workflow_dispatch:
    inputs:
      action_tag:
        description: Action to run
        required: true
        type: choice
        options:
          - test
      runner_pool_tag:
        description: Private ephemeral JIT runner pool
        required: true
        type: choice
        options:
          - private

permissions: {}

jobs:
  smoke:
    if: github.ref == 'refs/heads/main'
    timeout-minutes: 5
    runs-on:
      group: gvisor-sandbox
      labels: gvisor-sandbox
    steps:
      - name: Check runner boundary
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -s)" = Linux
          test "$(uname -m)" = x86_64
          test ! -S /var/run/docker.sock
          test ! -S /run/podman/podman.sock
          printf 'repository=%s\nrunner=%s\ncommit=%s\n' \
            "$GITHUB_REPOSITORY" "$RUNNER_NAME" "$GITHUB_SHA"
