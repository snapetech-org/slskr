name: Release-note contract

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

concurrency:
  group: ng-release-notes-${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}-${{ github.event.action == 'edited' && 'metadata' || 'code' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'pull_request_target' }}

permissions:
  contents: read
  pull-requests: read

jobs:
  release-notes:
    name: Validate release-note fragment or explicit opt-out
    if: github.event.pull_request.user.type != 'Bot'
    runs-on: ubuntu-latest
    steps:
      - name: Check out the pull-request base
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Read changed pull-request files
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          expected_files=$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" --jq '.changed_files')
          if [[ ! "$expected_files" =~ ^[0-9]+$ || "$expected_files" -gt 3000 ]]; then
            echo "GitHub reports an invalid or unsupported pull-request file count; refusing incomplete release-note validation" >&2
            exit 1
          fi
          gh api --paginate --jq '.[] | {filename,status,patch}' \
            "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/files" \
            > "$RUNNER_TEMP/pull-request-files.jsonl"
          actual_files=$(wc -l < "$RUNNER_TEMP/pull-request-files.jsonl" | tr -d '[:space:]')
          if [[ "$actual_files" != "$expected_files" ]]; then
            echo "GitHub returned ${actual_files} of ${expected_files} changed files; refusing incomplete release-note validation" >&2
            exit 1
          fi

      - name: Validate and preview release notes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          set -euo pipefail
          python3 - "$RUNNER_TEMP/pull-request-files.jsonl" <<'PY'
          import json
          import sys
          from pathlib import Path, PurePosixPath

          release_notes_dir = PurePosixPath("release-notes")
          errors = []
          files_jsonl = Path(sys.argv[1])
          for line_number, line in enumerate(
              files_jsonl.read_text(encoding="utf-8").splitlines(), start=1
          ):
              try:
                  item = json.loads(line)
              except json.JSONDecodeError as error:
                  errors.append(f"pull-request file data line {line_number} is invalid JSON ({error})")
                  continue
              if not isinstance(item, dict) or not isinstance(item.get("filename"), str):
                  errors.append(f"pull-request file data line {line_number} has no filename")
                  continue

              file_name = item["filename"]
              if any(ord(character) < 0x20 or ord(character) == 0x7F for character in file_name):
                  errors.append(
                      f"pull-request file data line {line_number} has a control character in its filename"
                  )
                  continue
              safe_name = json.dumps(file_name, ensure_ascii=True)
              path = PurePosixPath(file_name)
              if (
                  path.parent != release_notes_dir
                  or path.suffix != ".md"
                  or path.name.lower() == "readme.md"
              ):
                  continue
              if item.get("status") != "added":
                  errors.append(
                      f"{safe_name}: release-note fragments are append-only; add a new fragment instead"
                  )
                  continue

              patch = item.get("patch")
              if not isinstance(patch, str) or len(patch) > 16_384:
                  errors.append(f"{safe_name}: GitHub did not return a complete text patch")
                  continue

              content = []
              for patch_line in patch.splitlines():
                  if patch_line.startswith(("@@", "+++ ", "--- ")):
                      continue
                  if patch_line.startswith("\\ No newline at end of file"):
                      continue
                  if patch_line.startswith("+"):
                      content.append(patch_line[1:])
                  elif patch_line.startswith(" "):
                      content.append(patch_line[1:])
                  elif patch_line.startswith("-"):
                      errors.append(f"{safe_name}: unexpected removed line in an added file")
                      break
                  elif patch_line:
                      errors.append(f"{safe_name}: GitHub returned an unexpected patch line")
                      break
              else:
                  target = Path("release-notes") / path.name
                  if target.exists():
                      errors.append(f"{safe_name}: the new fragment already exists in the base revision")
                      continue
                  target.write_text("\n".join(content) + "\n", encoding="utf-8")

          if errors:
              print("Release-note pull-request validation failed:", file=sys.stderr)
              for error in errors:
                  print(f"- {error}", file=sys.stderr)
              raise SystemExit(1)
          PY
          python3 scripts/release_notes.py check \
            --base "$BASE_SHA" \
            --head WORKTREE \
            --pr-body-env PR_BODY \
            --summary-file "$GITHUB_STEP_SUMMARY"

