name: CI

env:
  ACTIONLINT_VERSION: v1.7.12
  CARGO_AUDIT_VERSION: 0.22.1
  CARGO_AUDIT_CACHE_SCHEMA: v2
  SLSKR_SECURITY_SCANS_REQUIRED: '1'
  SLSKR_SEMGREP_IMAGE: semgrep/semgrep:1.167.0
  SLSKR_TRIVY_IMAGE: aquasec/trivy:0.72.0

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  web-assets:
    name: Production web assets
    if: github.event_name != 'push' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout@v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build production web assets
        run: |
          npm --prefix web ci --allow-git=root --legacy-peer-deps --no-audit --no-fund
          npm --prefix web run build
          node web/scripts/verify-build-output.mjs
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # actions/upload-artifact@v7.0.1
        with:
          name: ci-web-assets
          path: web/build/
          if-no-files-found: error
          retention-days: 7

  rust:
    # Pull requests, non-main refs, and an unready pool stay hosted.
    runs-on: ${{ ((github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')) && vars.TRUSTED_MAIN_RUNNERS_ENABLED == 'true' && 'trusted-main' || 'ubuntu-latest' }}
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout@v6
        with:
          fetch-depth: 2
      - name: Protect local runner command files before repository scripts
        if: runner.environment == 'self-hosted' && runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          import stat

          def fail(message):
              raise SystemExit(message)

          runner_temp_input = os.environ.get('RUNNER_TEMP', '')
          if not runner_temp_input or not os.path.isabs(runner_temp_input):
              fail('RUNNER_TEMP must be an absolute path.')
          runner_temp = os.path.realpath(runner_temp_input)
          uid = os.geteuid()
          if not runner_temp or not os.path.isabs(runner_temp) or runner_temp in ('/', '/tmp', '/var/tmp', '/dev/shm') or runner_temp.startswith(('/tmp/', '/var/tmp/', '/dev/shm/')):
              fail('RUNNER_TEMP must be private and outside shared temporary roots.')

          current = runner_temp
          while True:
              descriptor = os.open(current, os.O_RDONLY | os.O_DIRECTORY | os.O_NOFOLLOW)
              try:
                  metadata = os.fstat(descriptor)
                  if not stat.S_ISDIR(metadata.st_mode):
                      fail('RUNNER_TEMP ancestry must contain only real directories.')
                  if current == runner_temp:
                      if metadata.st_uid != uid:
                          fail('RUNNER_TEMP must be owned by the workflow runner.')
                      os.fchmod(descriptor, 0o700)
                  else:
                      mode = stat.S_IMODE(metadata.st_mode)
                      writable = mode & 0o022
                      sticky = mode & stat.S_ISVTX
                      if writable and not sticky:
                          fail('A RUNNER_TEMP parent is writable by other users without the sticky bit.')
                      if writable and sticky and metadata.st_uid not in (0, uid):
                          fail('A writable sticky RUNNER_TEMP parent must be owned by root or the workflow runner.')
              finally:
                  os.close(descriptor)
              if current == '/':
                  break
              parent = os.path.dirname(current)
              if parent == current:
                  break
              current = parent

          for variable in ('GITHUB_ENV', 'GITHUB_OUTPUT'):
              command_file = os.environ.get(variable, '')
              if not os.path.isabs(command_file) or '\n' in command_file or '\r' in command_file:
                  fail(variable + ' must be an absolute path without line breaks.')
              parent = os.path.realpath(os.path.dirname(command_file))
              if os.path.commonpath((runner_temp, parent)) != runner_temp:
                  fail(variable + ' must be inside RUNNER_TEMP.')
              current = parent
              while True:
                  descriptor = os.open(current, os.O_RDONLY | os.O_DIRECTORY | os.O_NOFOLLOW)
                  try:
                      metadata = os.fstat(descriptor)
                      if not stat.S_ISDIR(metadata.st_mode) or metadata.st_uid != uid:
                          fail(variable + ' parent directories must be owned by the workflow runner.')
                      os.fchmod(descriptor, 0o700)
                  finally:
                      os.close(descriptor)
                  if current == runner_temp:
                      break
                  current = os.path.dirname(current)
              directory_fd = os.open(parent, os.O_RDONLY | os.O_DIRECTORY | os.O_NOFOLLOW)
              try:
                  descriptor = os.open(os.path.basename(command_file), os.O_WRONLY | os.O_NOFOLLOW, dir_fd=directory_fd)
                  try:
                      metadata = os.fstat(descriptor)
                      if not stat.S_ISREG(metadata.st_mode) or metadata.st_uid != uid or metadata.st_nlink != 1:
                          fail(variable + ' must be a regular, runner-owned file without hard links.')
                      os.fchmod(descriptor, 0o600)
                  finally:
                      os.close(descriptor)
              finally:
                  os.close(directory_fd)
          PY

      - name: Test private runner temporary storage setup
        if: runner.os == 'Linux'
        run: ./scripts/test-private-runner-temp.sh

      - name: Configure private runner temporary storage
        id: private-runner-temp
        if: runner.os == 'Linux'
        env:
          PRIVATE_RUNNER_TEMP_PREFIX: slskr
        run: ./scripts/prepare-private-runner-temp.sh

      - name: Limit local Cargo build parallelism
        if: runner.environment == 'self-hosted'
        shell: bash
        run: |
          set -euo pipefail
          printf 'CARGO_BUILD_JOBS=1\n' >> "$GITHUB_ENV"

      - name: Configure private Go temporary storage
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -m 700 -- "$PRIVATE_RUNNER_TEMP/go-tmp"
          printf 'GOTMPDIR=%s/go-tmp\n' "$PRIVATE_RUNNER_TEMP" >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.94.0
          components: clippy, rustfmt
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # Swatinem/rust-cache@v2
      - name: Prefer rustup toolchain binaries
        run: dirname "$(rustup which cargo)" >> "$GITHUB_PATH"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            dashboard/package-lock.json
            client-ts/package-lock.json
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # actions/setup-go@v7.0.0
        with:
          go-version: '1.25.x'
          cache-dependency-path: client-go/go.sum
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # actions/setup-python@v7.0.0
        if: runner.environment == 'github-hosted'
        with:
          python-version: '3.12'
      - name: Set up Python 3.12 on the local runner
        if: runner.environment == 'self-hosted'
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: '0.13.0'
          python-version: '3.12'
          activate-environment: true
          venv-path: ${{ steps.private-runner-temp.outputs.path || runner.temp }}/slskr-python
          no-project: true
          enable-cache: false
      - name: Install workflow and shell linters on GitHub-hosted runner
        if: runner.environment == 'github-hosted'
        run: |
          sudo apt-get update
          sudo apt-get install -y ripgrep shellcheck
      - name: Verify workflow and shell linters on local runner
        if: runner.environment == 'self-hosted'
        run: |
          command -v rg
          command -v shellcheck
      - name: Install actionlint
        run: |
          go install "github.com/rhysd/actionlint/cmd/actionlint@${ACTIONLINT_VERSION}"
          echo "$HOME/go/bin" >> "$GITHUB_PATH"
      - name: Lint GitHub workflows
        run: actionlint
      - name: Restore cargo-audit
        id: cargo-audit-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # actions/cache@v6.1.0
        with:
          path: ~/.cargo/bin/cargo-audit
          key: cargo-audit-${{ env.CARGO_AUDIT_CACHE_SCHEMA }}-${{ runner.os }}-${{ runner.arch }}-${{ env.CARGO_AUDIT_VERSION }}
      - name: Ensure cargo-audit is available
        run: scripts/ensure-cargo-audit.sh
      - name: Test cargo-audit cache and PATH handling
        run: scripts/test-ensure-cargo-audit.sh
      - run: scripts/check-process-memory-guard.sh
      - run: scripts/test-process-memory-guard.sh
      - run: scripts/test-live-interop-account-validation.sh
      - run: scripts/check-audit-tooling.sh
      - run: scripts/check-public-posture.sh
      - run: scripts/validate-changelog.sh
      - run: scripts/check-docs-freshness.sh
      - run: scripts/test-check-docs-freshness.sh
      - run: scripts/check-plan-freshness.sh
      - run: scripts/test-check-plan-freshness.sh
      - run: scripts/check-rust-format.sh
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - run: cargo check --locked -p slskr-web --target wasm32-unknown-unknown
      - name: Run and receipt the native Linux x64 Rust test node
        timeout-minutes: 270
        env:
          VALIDATION_NODE_ID: linux-x64
          VALIDATION_RECEIPT_EXPORT: ${{ steps.private-runner-temp.outputs.path || runner.temp }}/validation/rust-linux-x64.json
        run: node scripts/validate-development.mjs --tests-only
      - name: Retain Linux x64 validation task logs
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # actions/upload-artifact@v7.0.1
        with:
          name: validation-task-logs-linux-x64-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/slskr-validation-*/*.log
          if-no-files-found: ignore
          retention-days: 7
      - name: Retain Linux x64 Rust test receipt
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # actions/upload-artifact@v7.0.1
        with:
          name: validation-rust-linux-x64-attempt-${{ github.run_attempt }}
          path: ${{ steps.private-runner-temp.outputs.path || runner.temp }}/validation/rust-linux-x64.json
          if-no-files-found: warn
          retention-days: 7
      - run: cargo audit
      - run: scripts/run-security-scans.sh
      - run: bash scripts/check-web-audit.sh
      - run: npm --prefix web run lint
      - run: npm --prefix web run build
      - run: npm --prefix web run test:bundle-budget
      - run: node web/scripts/verify-build-output.mjs
      - run: node web/scripts/smoke-subpath-build.mjs
      - run: bash scripts/check-web-audit.sh dashboard
      - run: npm --prefix dashboard run type-check
      - run: npm --prefix dashboard run lint
      - run: npm --prefix dashboard run build
      - run: npm --prefix dashboard run test:bundle-budget
      - name: Prove shared peer gateway shutdown
        run: |
          cargo build --locked -p slskr --bin slskr
          python3 scripts/run-shared-tcp-shutdown-proof.py \
            --output target/reproducibility/shared-tcp-shutdown.json \
            --cycles 3
          python3 scripts/run-shared-tcp-shutdown-proof.py \
            --output target/reproducibility/shared-all-transports-shutdown.json \
            --all-udp-transports --cycles 3
          python3 scripts/run-rf-shutdown-overlap.py \
            --output target/reproducibility/rf-shutdown-overlap.json \
            --fixture-files 20000
      - name: Collect reproducibility evidence
        run: |
          python3 scripts/collect-reproducibility-metadata.py \
            --output target/reproducibility/ci-rust.json \
            --artifact-name ci-reproducibility-rust \
            --artifact dashboard/coverage/coverage-summary.json \
            --artifact web/build/index.html \
            --artifact target/reproducibility/rf-shutdown-overlap.json \
            --artifact target/reproducibility/shared-tcp-shutdown.json \
            --artifact target/reproducibility/shared-all-transports-shutdown.json \
            --validate
      - name: Retain reproducibility evidence
        id: reproducibility-artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # actions/upload-artifact@v7.0.1
        with:
          name: ci-reproducibility-rust
          path: |
            target/reproducibility/ci-rust.json
            target/reproducibility/rf-shutdown-overlap.json
            target/reproducibility/shared-tcp-shutdown.json
            target/reproducibility/shared-all-transports-shutdown.json
            dashboard/coverage/coverage-summary.json
            web/build/index.html
          if-no-files-found: error
          retention-days: 30
      - name: Link reproducibility evidence
        env:
          REPRODUCIBILITY_ARTIFACT_URL: ${{ steps.reproducibility-artifact.outputs.artifact-url }}
        run: printf '[Reproducibility evidence](%s)\n' "$REPRODUCIBILITY_ARTIFACT_URL" >> "$GITHUB_STEP_SUMMARY"

  linux-aarch64:
    name: Linux AArch64
    if: github.event_name != 'push' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout@v6
        with:
          fetch-depth: 2
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # actions/setup-node@v6
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.94.0
          targets: aarch64-unknown-linux-musl
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # Swatinem/rust-cache@v2
      - name: Prefer rustup toolchain binaries
        run: dirname "$(rustup which cargo)" >> "$GITHUB_PATH"
      - name: Install musl toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools
      - name: Check native GNU build
        run: cargo check --locked --workspace --all-targets
      - name: Run and receipt the native Linux AArch64 Rust test node
        timeout-minutes: 100
        env:
          VALIDATION_NODE_ID: linux-aarch64
          VALIDATION_RECEIPT_EXPORT: ${{ runner.temp }}/validation/rust-linux-aarch64.json
        run: node scripts/validate-development.mjs --task rust-workspace-tests
      - name: Retain Linux AArch64 validation task logs
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # actions/upload-artifact@v7.0.1
        with:
          name: validation-task-logs-linux-aarch64-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/slskr-validation-*/*.log
          if-no-files-found: ignore
          retention-days: 7
      - name: Retain Linux AArch64 Rust test receipt
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # actions/upload-artifact@v7.0.1
        with:
          name: validation-rust-linux-aarch64-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/validation/rust-linux-aarch64.json
          if-no-files-found: warn
          retention-days: 7
      - name: Check static musl build
        run: cargo check --locked -p slskr --target aarch64-unknown-linux-musl

  platform-builds:
    name: Platform ${{ matrix.name }}
    if: github.event_name != 'push' || github.ref == 'refs/heads/main'
    needs: web-assets
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    env:
      CARGO_NET_GIT_FETCH_WITH_CLI: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            apt: ''
            native_tests: false
          - name: linux-musl-x64
            os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            apt: musl-tools
            native_tests: false
          - name: linux-arm64
            os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            apt: ''
            native_tests: false
          - name: linux-musl-arm64
            os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            apt: musl-tools
            native_tests: false
          - name: macos-x64
            os: macos-15-intel
            target: x86_64-apple-darwin
            apt: ''
            native_tests: true
          - name: macos-arm64
            os: macos-15
            target: aarch64-apple-darwin
            apt: ''
            native_tests: true
          - name: windows-x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            apt: ''
            native_tests: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout@v6
        with:
          fetch-depth: 2
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.94.0
          targets: |
            ${{ matrix.target }}
            wasm32-unknown-unknown
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # actions/setup-node@v6
        with:
          node-version: '22'
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # Swatinem/rust-cache@v2
      - name: Prefer rustup toolchain binaries
        shell: bash
        run: dirname "$(rustup which cargo)" >> "$GITHUB_PATH"
      - name: Clear Unix compiler wrapper on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          'RUSTC_WRAPPER=' | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          'CARGO_BUILD_RUSTC_WRAPPER=' | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Enable long Git paths
        if: runner.os == 'Windows'
        shell: bash
        run: git config --global core.longpaths true
      - name: Select full Perl for vendored OpenSSL
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/select-windows-perl.ps1
      - name: Install native packages
        if: matrix.apt != ''
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y ${{ matrix.apt }}
      - name: Run native workspace tests
        if: matrix.native_tests
        timeout-minutes: 100
        shell: bash
        env:
          VALIDATION_NODE_ID: ${{ matrix.name }}
          VALIDATION_RECEIPT_EXPORT: ${{ runner.temp }}/validation/rust-${{ matrix.name }}.json
        run: node scripts/validate-development.mjs --task rust-workspace-tests
      - name: Retain ${{ matrix.name }} validation task logs
        if: failure() && matrix.native_tests
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # actions/upload-artifact@v7.0.1
        with:
          name: validation-task-logs-${{ matrix.name }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/slskr-validation-*/*.log
          if-no-files-found: ignore
          retention-days: 7
      - name: Retain native platform Rust test receipt
        if: always() && matrix.native_tests
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # actions/upload-artifact@v7.0.1
        with:
          name: validation-rust-${{ matrix.name }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/validation/rust-${{ matrix.name }}.json
          if-no-files-found: warn
          retention-days: 7
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # actions/download-artifact@v8.3.0
        with:
          name: ci-web-assets
          path: web/build
      - name: Build release archive
        shell: bash
        env:
          SLSKR_RELEASE_VERSION: ci-${{ github.sha }}
        run: scripts/build-release-archive.sh --target '${{ matrix.target }}' --skip-web-build
      - name: Verify release archive
        shell: bash
        run: scripts/verify-release-artifacts.sh target/dist
      - name: Run Windows archive smoke
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $archive = Get-ChildItem 'target/dist/*.zip' | Select-Object -First 1
          if ($null -eq $archive) {
            throw 'Windows archive was not produced'
          }
          $extract = Join-Path $env:RUNNER_TEMP "slskr-archive-$env:GITHUB_RUN_ID"
          Expand-Archive -LiteralPath $archive.FullName -DestinationPath $extract
          $binary = Get-ChildItem -LiteralPath $extract -Filter 'slskr.exe' -Recurse | Select-Object -First 1
          if ($null -eq $binary) {
            throw 'Windows archive does not contain slskr.exe'
          }
          & $binary.FullName version
          if ($LASTEXITCODE -ne 0) {
            throw "Packaged Windows binary exited with status $LASTEXITCODE"
          }
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # actions/upload-artifact@v7.0.1
        with:
          name: ci-${{ matrix.name }}
          path: |
            target/dist/*.tar.gz
            target/dist/*.zip
            target/dist/*.sha256
          if-no-files-found: error
          retention-days: 7

  validation-reconcile:
    name: Reconcile native Rust test nodes
    if: always() && (github.event_name != 'push' || github.ref == 'refs/heads/main')
    needs: [rust, linux-aarch64, platform-builds]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout@v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # actions/setup-node@v6
        with:
          node-version: '22'
      - name: Prepare receipt directory
        run: mkdir -p "$RUNNER_TEMP/validation-receipts"
      - name: Download current-run Rust receipts
        id: download-receipts
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # actions/download-artifact@v8.3.0
        with:
          pattern: validation-rust-*
          path: ${{ runner.temp }}/validation-receipts
          merge-multiple: false
      - name: Reconcile this run, source and inventory across retries
        run: node scripts/validation-engine/reconcile-rust-matrix.mjs --receipts "$RUNNER_TEMP/validation-receipts"

  package-surfaces:
    name: Package and deployment surfaces
    needs: [platform-builds, validation-reconcile]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout@v6
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # actions/download-artifact@v8.3.0
        with:
          pattern: ci-linux-*
          merge-multiple: true
          path: target/dist
      - name: Install package builders
        run: |
          set -euo pipefail
          # Ubuntu's amd64 archive does not carry arm64 packages. Keep the
          # host repositories amd64-only and add Ubuntu Ports for the
          # foreign architecture used by dpkg-shlibdeps below.
          codename="$(. /etc/os-release && printf '%s' "$VERSION_CODENAME")"
          if [[ -f /etc/apt/sources.list.d/ubuntu.sources ]]; then
            sudo sed -i '/^Components:/a Architectures: amd64' /etc/apt/sources.list.d/ubuntu.sources
          elif [[ -f /etc/apt/sources.list ]]; then
            sudo sed -i -E 's|^deb[[:space:]]+|deb [arch=amd64] |' /etc/apt/sources.list
          fi
          sudo tee /etc/apt/sources.list.d/slskr-arm64.sources >/dev/null <<EOF
          Types: deb
          URIs: http://ports.ubuntu.com/ubuntu-ports/
          Suites: ${codename} ${codename}-updates ${codename}-security
          Components: main universe restricted multiverse
          Architectures: arm64
          Signed-By: /usr/share/keyrings/ubuntu-archive-keyring.gpg
          EOF
          sudo dpkg --add-architecture arm64
          sudo apt-get update
          if apt-cache show libssl3:arm64 >/dev/null 2>&1; then
            arm_ssl_package=libssl3
          else
            arm_ssl_package=libssl3t64
          fi
          sudo apt-get install -y \
            binutils-aarch64-linux-gnu \
            debhelper \
            devscripts \
            flatpak-builder \
            libc6:arm64 \
            libgcc-s1:arm64 \
            "${arm_ssl_package}:arm64" \
            libstdc++6:arm64 \
            ripgrep \
            rpm
      - name: Run release surface policy checks
        run: |
          scripts/check-workflow-release-policy.sh
          scripts/check-package-artifact-matrix.sh
          scripts/check-aur-packaging-checksums.sh
          scripts/check-aur-package-smoke.sh
          scripts/check-release-version-metadata.sh
          scripts/check-kubernetes-public-posture.sh
      - name: Lint deployment charts
        run: |
          helm lint packaging/helm/slskr
          helm lint packaging/truenas-scale/charts/slskr
      - name: Validate Flatpak sources for both Linux architectures
        shell: bash
        run: |
          set -euo pipefail
          flatpak-builder --show-manifest packaging/flatpak/io.github.slskd.slskr.yml >/dev/null
          for flatpak_arch in x86_64 aarch64; do
            flatpak-builder \
              --download-only \
              --allow-missing-runtimes \
              --arch "$flatpak_arch" \
              "$RUNNER_TEMP/slskr-flatpak-$flatpak_arch" \
              packaging/flatpak/io.github.slskd.slskr.yml
          done
      - name: Build Debian packages for amd64 and arm64
        shell: bash
        run: |
          set -euo pipefail
          package_version="$(awk '/^Version:/ { print $2; exit }' packaging/rpm/slskr.spec)"
          debian_version="$(sed -n '1s/^slskr (\([^)]*\)-[0-9][^)]*).*/\1/p' packaging/debian/changelog)"
          test -n "$package_version"
          test "$package_version" = "$debian_version"
          for deb_arch in amd64 arm64; do
            build_root="$RUNNER_TEMP/slskr-deb-$deb_arch"
            rm -rf "$build_root"
            mkdir -p "$build_root/vendor" "$build_root/lib/systemd/system" "$build_root/usr/lib/sysusers.d" "$build_root/usr/lib/tmpfiles.d"
            cp -a packaging/debian "$build_root/debian"
            cp packaging/aur/slskr.service "$build_root/lib/systemd/system/slskr.service"
            cp packaging/aur/slskr.sysusers "$build_root/usr/lib/sysusers.d/slskr.conf"
            cp packaging/aur/slskr.tmpfiles "$build_root/usr/lib/tmpfiles.d/slskr.conf"
            cp target/dist/slskr-ci-*-x86_64-unknown-linux-gnu.tar.gz "$build_root/vendor/slskr-v${package_version}-x86_64-unknown-linux-gnu.tar.gz"
            cp target/dist/slskr-ci-*-aarch64-unknown-linux-gnu.tar.gz "$build_root/vendor/slskr-v${package_version}-aarch64-unknown-linux-gnu.tar.gz"
            (cd "$build_root" && dpkg-buildpackage -us -uc -d -b -a "$deb_arch")
          done
      - name: Build RPMs for x86_64 and aarch64
        shell: bash
        run: |
          set -euo pipefail
          package_version="$(awk '/^Version:/ { print $2; exit }' packaging/rpm/slskr.spec)"
          test -n "$package_version"
          for rpm_arch in x86_64 aarch64; do
            rpm_top="$RUNNER_TEMP/slskr-rpm-$rpm_arch"
            rm -rf "$rpm_top"
            mkdir -p "$rpm_top"/{SOURCES,SPECS,BUILD,BUILDROOT,RPMS,SRPMS}
            cp target/dist/slskr-ci-*-x86_64-unknown-linux-gnu.tar.gz "$rpm_top/SOURCES/slskr-v${package_version}-x86_64-unknown-linux-gnu.tar.gz"
            cp target/dist/slskr-ci-*-aarch64-unknown-linux-gnu.tar.gz "$rpm_top/SOURCES/slskr-v${package_version}-aarch64-unknown-linux-gnu.tar.gz"
            cp packaging/aur/slskr.service "$rpm_top/SOURCES/slskr.service"
            cp packaging/aur/slskr.sysusers "$rpm_top/SOURCES/slskr.sysusers"
            cp packaging/aur/slskr.tmpfiles "$rpm_top/SOURCES/slskr.tmpfiles"
            cp packaging/rpm/slskr.spec "$rpm_top/SPECS/slskr.spec"
            rpmbuild -ba --nodeps --target "$rpm_arch" \
              --define "_topdir $rpm_top" \
              "$rpm_top/SPECS/slskr.spec"
          done
