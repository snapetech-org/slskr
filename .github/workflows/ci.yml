# ng-runner-policy: private-jit-only-v1
name: CI
run-name: ${{ format('action:{0}:pool:{1}{2}', inputs.action_tag, inputs.runner_pool_tag, startsWith(github.ref, 'refs/tags/') && format(':tag:{0}', github.ref_name) || '') }}

env:
  ACTIONLINT_VERSION: v1.7.12
  CARGO_AUDIT_VERSION: 0.22.1
  CARGO_AUDIT_CACHE_SCHEMA: v2
  SLSKR_SECURITY_SCANS_REQUIRED: '1'
  SLSKR_SEMGREP_IMAGE: semgrep/semgrep:1.167.0
  SLSKR_TRIVY_IMAGE: aquasec/trivy:0.72.0

on:
  workflow_dispatch:
    inputs:
      action_tag:
        description: Action to run
        required: true
        type: choice
        options:
          - test
      runner_pool_tag:
        description: Private ephemeral JIT runner pool
        required: true
        type: choice
        options:
          - private

# Keep every validation attempt isolated so retries are never canceled or conflated.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.run_id }}-${{ github.run_attempt }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  web-assets:
    name: Production web assets
    if: github.event_name != 'push' || github.ref == 'refs/heads/main'
    runs-on: ${{ fromJSON(format('{{"group":"ng-shared-main-jit","labels":["self-hosted","linux","x64","ng-shared-main-slskr","ng-main-run-{0}"]}}', github.run_id)) }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout@v6
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # actions/setup-node@v7.1.0
        with:
          node-version: '22.23.4'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build production web assets
        run: |
          npm --prefix web ci --allow-git=root --legacy-peer-deps --no-audit --no-fund
          npm --prefix web run build
          node web/scripts/verify-build-output.mjs
      - name: Test Web UI localization coverage
        run: npm --prefix web test -- src/lib/interfaceLocale.test.js
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # actions/upload-artifact@v7.0.2
        with:
          name: ci-web-assets
          path: web/build/
          if-no-files-found: error
          retention-days: 7

  controller-regex-parity:
    name: Controller regex parity
    runs-on: ${{ fromJSON(format('{{"group":"ng-shared-main-jit","labels":["self-hosted","linux","x64","ng-shared-main-slskr","ng-main-run-{0}"]}}', github.run_id)) }}
    timeout-minutes: 20
    env:
      DOTNET_VERSION: '10.0.402'
      DOTNET_INSTALL_DIR: ${{ github.workspace }}/.dotnet
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout@v6
        with:
          fetch-depth: 2
      - name: Check out frozen controller parity references
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout@v6
        with:
          repository: snapetech-org/slskdN
          path: slskdn-reference
          fetch-depth: 0
          persist-credentials: false
      - name: Fetch frozen slskd parity reference
        run: |
          git -C slskdn-reference fetch --no-tags --depth=1 \
            https://github.com/slskd/slskd.git \
            16e5d86ec9a91120f3ef40b85cb22036566b788a
          git -C slskdn-reference cat-file -e \
            '16e5d86ec9a91120f3ef40b85cb22036566b788a^{commit}'
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.94.0
      - uses: Swatinem/rust-cache@c8037a86dde8214a8310e9f54a8fc61ab362aa31 # Swatinem/rust-cache@v2
      - name: Prefer rustup toolchain binaries
        run: dirname "$(rustup which cargo)" >> "$GITHUB_PATH"
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libssl-dev ripgrep
      - name: Set up .NET SDK for controller parity
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # actions/setup-dotnet@v6.0.0
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - name: Build daemon for protocol differential
        run: cargo build --locked -p slskr
      - name: Record .NET runtime used by the upstream references
        run: |
          dotnet --info
          dotnet --list-runtimes
          locale
      - name: Compare controller regex protocol behavior
        env:
          SLSKR_UPSTREAM_GIT_REPO: ${{ github.workspace }}/slskdn-reference
          SLSKR_OPTIONS_DIFFERENTIAL_SCENARIOS: regex-protocol
          SLSKR_OPTIONS_DIFFERENTIAL_KEEP: '0'
        run: scripts/check-controller-options-differential.sh

  rust:
    # Trusted main Rust validation uses the isolated shared pool.
    runs-on: ${{ fromJSON(format('{{"group":"ng-shared-main-jit","labels":["self-hosted","linux","x64","ng-shared-main-slskr","ng-main-run-{0}"]}}', github.run_id)) }}
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout@v6
        with:
          fetch-depth: 2
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.94.0
          components: clippy, rustfmt
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@c8037a86dde8214a8310e9f54a8fc61ab362aa31 # Swatinem/rust-cache@v2
      - name: Prefer rustup toolchain binaries
        run: dirname "$(rustup which cargo)" >> "$GITHUB_PATH"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # actions/setup-node@v7.1.0
        with:
          node-version: '22.23.4'
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            dashboard/package-lock.json
            client-ts/package-lock.json
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # actions/setup-go@v7.0.0
        with:
          go-version: '1.25.x'
          cache-dependency-path: client-go/go.sum
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # actions/setup-python@v7.1.0
        with:
          python-version: '3.12'
      - name: Install locked Web dependencies
        run: npm --prefix web ci --allow-git=root --legacy-peer-deps --no-audit --no-fund
      - name: Install locked dashboard dependencies
        run: npm --prefix dashboard ci --no-audit --no-fund
      - name: Install workflow and shell linters
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libssl-dev ripgrep shellcheck
      - name: Install actionlint
        run: |
          go install "github.com/rhysd/actionlint/cmd/actionlint@${ACTIONLINT_VERSION}"
          echo "$HOME/go/bin" >> "$GITHUB_PATH"
      - name: Lint GitHub workflows
        run: actionlint
      - name: Restore cargo-audit
        id: cargo-audit-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # actions/cache@v6.1.0
        with:
          path: ~/.cargo/bin/cargo-audit
          key: cargo-audit-${{ env.CARGO_AUDIT_CACHE_SCHEMA }}-${{ runner.os }}-${{ runner.arch }}-${{ env.CARGO_AUDIT_VERSION }}
      - name: Ensure cargo-audit is available
        run: scripts/ensure-cargo-audit.sh
      - name: Test cargo-audit cache and PATH handling
        run: scripts/test-ensure-cargo-audit.sh
      - run: scripts/check-process-memory-guard.sh
      - run: scripts/test-process-memory-guard.sh
      - run: scripts/test-live-interop-account-validation.sh
      - run: scripts/check-audit-tooling.sh
      - run: scripts/check-public-posture.sh
      - run: scripts/validate-changelog.sh
      - run: scripts/check-docs-freshness.sh
      - run: scripts/test-check-docs-freshness.sh
      - run: scripts/check-plan-freshness.sh
      - run: scripts/test-check-plan-freshness.sh
      - run: scripts/check-rust-format.sh
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - run: cargo check --locked -p slskr-web --target wasm32-unknown-unknown
      - name: Run Rust workspace tests
        timeout-minutes: 270
        run: cargo test --locked --workspace
      - name: Run client SDK checks
        env:
          GOTOOLCHAIN: local
          PYTHON_EXECUTABLE: python3.12
        run: bash scripts/check-client-sdk-gates.sh
      - name: Run repository Python tests
        env:
          PYTHONPATH: scripts
        run: python3.12 -m unittest -v scripts.test_release_notes scripts.test_compare_benchmark scripts.test_profile_sqlite scripts.test_check_web_bundle_budget
      - name: Run Web Vitest suite
        run: npm --prefix web test -- --reporter=verbose
      - name: Run Web API lifecycle coverage
        run: npm --prefix web run test:api-lifecycle-coverage
      - name: Run dashboard Vitest suite with coverage
        run: npm --prefix dashboard run test:coverage -- --reporter=verbose
      - name: Run Playwright fixture tests
        working-directory: web
        run: npx playwright test e2e/fixture-paths.spec.ts e2e/harness-lifecycle.spec.ts --reporter=line
      # RUSTSEC-2023-0071 has no upstream fix. openidconnect uses rsa here to
      # verify provider ID tokens with public keys; this app has no RSA
      # private-key operations for the advisory to expose.
      - run: cargo audit --ignore RUSTSEC-2023-0071
      - run: scripts/run-security-scans.sh
      - run: bash scripts/check-web-audit.sh
      - run: npm --prefix web run lint
      - run: npm --prefix web run build
      - run: npm --prefix web run test:bundle-budget
      - run: node web/scripts/verify-build-output.mjs
      - run: node web/scripts/smoke-subpath-build.mjs
      - name: Install TypeScript client dependencies
        run: npm ci --prefix client-ts
      - name: Build TypeScript client
        run: npm --prefix client-ts run build
      - name: Test TypeScript client
        run: npm --prefix client-ts test
      - name: Lint TypeScript client
        run: npm --prefix client-ts run lint
      - run: bash scripts/check-web-audit.sh dashboard
      - run: npm --prefix dashboard run type-check
      - run: npm --prefix dashboard run lint
      - run: npm --prefix dashboard run build
      - run: npm --prefix dashboard run test:bundle-budget
      - name: Prove shared peer gateway shutdown
        run: |
          cargo build --locked -p slskr --bin slskr
          python3 scripts/run-shared-tcp-shutdown-proof.py \
            --output target/reproducibility/shared-tcp-shutdown.json \
            --cycles 3
          python3 scripts/run-shared-tcp-shutdown-proof.py \
            --output target/reproducibility/shared-all-transports-shutdown.json \
            --all-udp-transports --cycles 3
          python3 scripts/run-rf-shutdown-overlap.py \
            --output target/reproducibility/rf-shutdown-overlap.json \
            --fixture-files 20000
      - name: Collect reproducibility evidence
        run: |
          python3 scripts/collect-reproducibility-metadata.py \
            --output target/reproducibility/ci-rust.json \
            --artifact-name ci-reproducibility-rust \
            --artifact dashboard/coverage/coverage-summary.json \
            --artifact web/build/index.html \
            --artifact target/reproducibility/rf-shutdown-overlap.json \
            --artifact target/reproducibility/shared-tcp-shutdown.json \
            --artifact target/reproducibility/shared-all-transports-shutdown.json \
            --validate
      - name: Retain reproducibility evidence
        id: reproducibility-artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # actions/upload-artifact@v7.0.2
        with:
          name: ci-reproducibility-rust
          path: |
            target/reproducibility/ci-rust.json
            target/reproducibility/rf-shutdown-overlap.json
            target/reproducibility/shared-tcp-shutdown.json
            target/reproducibility/shared-all-transports-shutdown.json
            dashboard/coverage/coverage-summary.json
            web/build/index.html
          if-no-files-found: error
          retention-days: 30
      - name: Link reproducibility evidence
        env:
          REPRODUCIBILITY_ARTIFACT_URL: ${{ steps.reproducibility-artifact.outputs.artifact-url }}
        run: printf '[Reproducibility evidence](%s)\n' "$REPRODUCIBILITY_ARTIFACT_URL" >> "$GITHUB_STEP_SUMMARY"

  linux-aarch64:
    name: Linux AArch64
    if: github.event_name != 'push' || github.ref == 'refs/heads/main'
    runs-on: ${{ fromJSON(format('{{"group":"ng-shared-main-jit","labels":["self-hosted","linux","arm64","ng-shared-main-slskr","ng-main-run-{0}","gha-{0}-linux-aarch64"]}}', github.run_id)) }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout@v6
        with:
          fetch-depth: 2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # actions/setup-node@v7.1.0
        with:
          node-version: '22.23.4'
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.94.0
          targets: aarch64-unknown-linux-musl
      - uses: Swatinem/rust-cache@c8037a86dde8214a8310e9f54a8fc61ab362aa31 # Swatinem/rust-cache@v2
      - name: Prefer rustup toolchain binaries
        run: dirname "$(rustup which cargo)" >> "$GITHUB_PATH"
      - name: Install musl toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools pkg-config libssl-dev
      - name: Check native GNU build
        run: cargo check --locked --workspace --all-targets
      - name: Run native Linux AArch64 Rust tests
        timeout-minutes: 100
        run: cargo test --locked --workspace
      - name: Check static musl build
        run: cargo check --locked -p slskr --target aarch64-unknown-linux-musl

  platform-builds:
    name: Platform ${{ matrix.name }}
    if: github.event_name != 'push' || github.ref == 'refs/heads/main'
    needs: web-assets
    runs-on: ${{ matrix.os == 'ubuntu-latest' && fromJSON(format('{{"group":"ng-shared-main-jit","labels":["self-hosted","linux","x64","ng-shared-main-slskr","ng-main-run-{0}","gha-{0}-{1}-platform-builds"]}}', github.run_id, strategy.job-index)) || matrix.os == 'ubuntu-24.04-arm' && fromJSON(format('{{"group":"ng-shared-main-jit","labels":["self-hosted","linux","arm64","ng-shared-main-slskr","ng-main-run-{0}","gha-{0}-{1}-platform-builds"]}}', github.run_id, strategy.job-index)) || matrix.os == 'macos-15-intel' && fromJSON(format('{{"group":"ng-shared-main-jit","labels":["self-hosted","macOS","X64","ng-shared-main-slskr","ng-main-run-{0}","gha-{0}-{1}-platform-builds"]}}', github.run_id, strategy.job-index)) || matrix.os == 'macos-15' && fromJSON(format('{{"group":"ng-shared-main-jit","labels":["self-hosted","macOS","ARM64","ng-shared-main-slskr","ng-main-run-{0}","gha-{0}-{1}-platform-builds"]}}', github.run_id, strategy.job-index)) || fromJSON(format('{{"group":"packer-windows","labels":["self-hosted","Windows","X64","packer-windows","ng-shared-main-slskr","ng-main-run-{0}","gha-{0}-{1}-platform-builds"]}}', github.run_id, strategy.job-index)) }}
    timeout-minutes: 120
    env:
      CARGO_NET_GIT_FETCH_WITH_CLI: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            apt: pkg-config libssl-dev
            native_tests: false
          - name: linux-musl-x64
            os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            apt: musl-tools pkg-config libssl-dev
            native_tests: false
          - name: linux-arm64
            os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            apt: pkg-config libssl-dev
            native_tests: false
          - name: linux-musl-arm64
            os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            apt: musl-tools pkg-config libssl-dev
            native_tests: false
          - name: macos-x64
            os: macos-15-intel
            target: x86_64-apple-darwin
            apt: ''
            native_tests: true
          - name: macos-arm64
            os: macos-15
            target: aarch64-apple-darwin
            apt: ''
            native_tests: true
          - name: windows-x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            apt: ''
            native_tests: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout@v6
        with:
          fetch-depth: 2
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.94.0
          targets: |
            ${{ matrix.target }}
            wasm32-unknown-unknown
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # actions/setup-node@v7.1.0
        with:
          node-version: '22.23.4'
      - uses: Swatinem/rust-cache@c8037a86dde8214a8310e9f54a8fc61ab362aa31 # Swatinem/rust-cache@v2
      - name: Prefer rustup toolchain binaries
        shell: bash
        run: dirname "$(rustup which cargo)" >> "$GITHUB_PATH"
      - name: Clear Unix compiler wrapper on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          'RUSTC_WRAPPER=' | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          'CARGO_BUILD_RUSTC_WRAPPER=' | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Enable long Git paths
        if: runner.os == 'Windows'
        shell: bash
        run: git config --global core.longpaths true
      - name: Select full Perl for vendored OpenSSL
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/select-windows-perl.ps1
      - name: Install native packages
        if: matrix.apt != ''
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y ${{ matrix.apt }}
      - name: Run native workspace tests
        if: matrix.native_tests
        timeout-minutes: 100
        shell: bash
        run: cargo test --locked --workspace
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # actions/download-artifact@v8.0.2
        with:
          name: ci-web-assets
          path: web/build
      - name: Build release archive
        shell: bash
        env:
          SLSKR_RELEASE_VERSION: ci-${{ github.sha }}
        run: scripts/build-release-archive.sh --target '${{ matrix.target }}' --skip-web-build
      - name: Verify release archive
        shell: bash
        run: scripts/verify-release-artifacts.sh target/dist
      - name: Run Windows archive smoke
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $archive = Get-ChildItem 'target/dist/*.zip' | Select-Object -First 1
          if ($null -eq $archive) {
            throw 'Windows archive was not produced'
          }
          $extract = Join-Path $env:RUNNER_TEMP "slskr-archive-$env:GITHUB_RUN_ID"
          Expand-Archive -LiteralPath $archive.FullName -DestinationPath $extract
          $binary = Get-ChildItem -LiteralPath $extract -Filter 'slskr.exe' -Recurse | Select-Object -First 1
          if ($null -eq $binary) {
            throw 'Windows archive does not contain slskr.exe'
          }
          & $binary.FullName version
          if ($LASTEXITCODE -ne 0) {
            throw "Packaged Windows binary exited with status $LASTEXITCODE"
          }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # actions/upload-artifact@v7.0.2
        with:
          name: ci-${{ matrix.name }}
          path: |
            target/dist/*.tar.gz
            target/dist/*.zip
            target/dist/*.sha256
          if-no-files-found: error
          retention-days: 7

  package-surfaces:
    name: Package and deployment surfaces
    needs: [platform-builds, rust, linux-aarch64]
    # Multiarch Debian and RPM packaging depends on matching Ubuntu Ports
    # versions; keep this job on the stable LTS image instead of the moving
    # ubuntu-latest label.
    runs-on: ${{ fromJSON(format('{{"group":"ng-shared-main-jit","labels":["self-hosted","linux","x64","ng-shared-main-slskr","ng-main-run-{0}"]}}', github.run_id)) }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout@v6
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # actions/download-artifact@v8.0.2
        with:
          pattern: ci-linux-*
          merge-multiple: true
          path: target/dist
      - name: Install package builders
        run: |
          set -euo pipefail
          # Ubuntu's amd64 archive does not carry arm64 packages. Keep the
          # host repositories amd64-only and add Ubuntu Ports for the
          # foreign architecture used by dpkg-shlibdeps below.
          codename="$(. /etc/os-release && printf '%s' "$VERSION_CODENAME")"
          if [[ -f /etc/apt/sources.list.d/ubuntu.sources ]]; then
            sudo sed -i '/^Components:/a Architectures: amd64' /etc/apt/sources.list.d/ubuntu.sources
          elif [[ -f /etc/apt/sources.list ]]; then
            sudo sed -i -E 's|^deb[[:space:]]+|deb [arch=amd64] |' /etc/apt/sources.list
          fi
          sudo tee /etc/apt/sources.list.d/slskr-arm64.sources >/dev/null <<EOF
          Types: deb
          URIs: http://ports.ubuntu.com/ubuntu-ports/
          Suites: ${codename} ${codename}-updates ${codename}-security
          Components: main universe restricted multiverse
          Architectures: arm64
          Signed-By: /usr/share/keyrings/ubuntu-archive-keyring.gpg
          EOF
          sudo dpkg --add-architecture arm64
          sudo apt-get update
          if apt-cache show libssl3:arm64 >/dev/null 2>&1; then
            arm_ssl_package=libssl3
          else
            arm_ssl_package=libssl3t64
          fi
          sudo apt-get install -y \
            binutils-aarch64-linux-gnu \
            debhelper \
            devscripts \
            flatpak-builder \
            libc6:arm64 \
            libgcc-s1:arm64 \
            "${arm_ssl_package}:arm64" \
            libstdc++6:arm64 \
            ripgrep \
            rpm
      - name: Run release surface policy checks
        run: |
          scripts/check-workflow-release-policy.sh
          scripts/check-package-artifact-matrix.sh
          scripts/check-aur-packaging-checksums.sh
          scripts/check-aur-package-smoke.sh
          scripts/check-release-version-metadata.sh
          scripts/check-kubernetes-public-posture.sh
      - name: Lint deployment charts
        run: |
          helm lint packaging/helm/slskr
          helm lint packaging/truenas-scale/charts/slskr
      - name: Validate Flatpak sources for both Linux architectures
        shell: bash
        run: |
          set -euo pipefail
          flatpak-builder --show-manifest packaging/flatpak/io.github.slskd.slskr.yml >/dev/null
          for flatpak_arch in x86_64 aarch64; do
            flatpak-builder \
              --download-only \
              --allow-missing-runtimes \
              --arch "$flatpak_arch" \
              "$RUNNER_TEMP/slskr-flatpak-$flatpak_arch" \
              packaging/flatpak/io.github.slskd.slskr.yml
          done
      - name: Build Debian packages for amd64 and arm64
        shell: bash
        run: |
          set -euo pipefail
          package_version="$(awk '/^Version:/ { print $2; exit }' packaging/rpm/slskr.spec)"
          debian_version="$(sed -n '1s/^slskr (\([^)]*\)-[0-9][^)]*).*/\1/p' packaging/debian/changelog)"
          test -n "$package_version"
          test "$package_version" = "$debian_version"
          for deb_arch in amd64 arm64; do
            build_root="$RUNNER_TEMP/slskr-deb-$deb_arch"
            rm -rf "$build_root"
            mkdir -p "$build_root/vendor" "$build_root/lib/systemd/system" "$build_root/usr/lib/sysusers.d" "$build_root/usr/lib/tmpfiles.d"
            cp -a packaging/debian "$build_root/debian"
            cp packaging/aur/slskr.service "$build_root/lib/systemd/system/slskr.service"
            cp packaging/aur/slskr.sysusers "$build_root/usr/lib/sysusers.d/slskr.conf"
            cp packaging/aur/slskr.tmpfiles "$build_root/usr/lib/tmpfiles.d/slskr.conf"
            cp target/dist/slskr-ci-*-x86_64-unknown-linux-gnu.tar.gz "$build_root/vendor/slskr-v${package_version}-x86_64-unknown-linux-gnu.tar.gz"
            cp target/dist/slskr-ci-*-aarch64-unknown-linux-gnu.tar.gz "$build_root/vendor/slskr-v${package_version}-aarch64-unknown-linux-gnu.tar.gz"
            (cd "$build_root" && dpkg-buildpackage -us -uc -d -b -a "$deb_arch")
          done
      - name: Build RPMs for x86_64 and aarch64
        shell: bash
        run: |
          set -euo pipefail
          package_version="$(awk '/^Version:/ { print $2; exit }' packaging/rpm/slskr.spec)"
          test -n "$package_version"
          for rpm_arch in x86_64 aarch64; do
            rpm_top="$RUNNER_TEMP/slskr-rpm-$rpm_arch"
            rm -rf "$rpm_top"
            mkdir -p "$rpm_top"/{SOURCES,SPECS,BUILD,BUILDROOT,RPMS,SRPMS}
            cp target/dist/slskr-ci-*-x86_64-unknown-linux-gnu.tar.gz "$rpm_top/SOURCES/slskr-v${package_version}-x86_64-unknown-linux-gnu.tar.gz"
            cp target/dist/slskr-ci-*-aarch64-unknown-linux-gnu.tar.gz "$rpm_top/SOURCES/slskr-v${package_version}-aarch64-unknown-linux-gnu.tar.gz"
            cp packaging/aur/slskr.service "$rpm_top/SOURCES/slskr.service"
            cp packaging/aur/slskr.sysusers "$rpm_top/SOURCES/slskr.sysusers"
            cp packaging/aur/slskr.tmpfiles "$rpm_top/SOURCES/slskr.tmpfiles"
            cp packaging/rpm/slskr.spec "$rpm_top/SPECS/slskr.spec"
            rpmbuild -ba --nodeps --target "$rpm_arch" \
              --define "_topdir $rpm_top" \
              "$rpm_top/SPECS/slskr.spec"
          done

