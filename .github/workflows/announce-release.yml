name: Announce Release
run-name: Discord announcement for ${{ inputs.tag }}

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Published release to announce
        required: true
        type: string
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
      release_workflow_call:
        description: Validated tag handoff from Release
        type: boolean
        default: false
    secrets:
      DISCORD_RELEASE_WEBHOOK_URL:
        required: true
      DISCORD_CHANGELOG_WEBHOOK:
        required: false

permissions:
  contents: read

concurrency:
  group: discord-announcement-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  announce:
    if: >-
      (inputs.release_workflow_call && github.ref == format('refs/tags/{0}', inputs.tag)) ||
      (!inputs.release_workflow_call && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Read the published release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --json tagName,body,isDraft,publishedAt,url > "$RUNNER_TEMP/discord-release.json"
      - name: Send and confirm Discord announcement
        env:
          DISCORD_RELEASE_WEBHOOK_URL: ${{ secrets.DISCORD_RELEASE_WEBHOOK_URL }}
          DISCORD_CHANGELOG_WEBHOOK: ${{ secrets.DISCORD_CHANGELOG_WEBHOOK }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          python3 scripts/discord_announcement.py \
            "$RUNNER_TEMP/discord-release.json" "$RUNNER_TEMP/discord-receipt.json"
      - name: Retain delivery confirmation
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: discord-announcement-${{ inputs.tag }}
          path: ${{ runner.temp }}/discord-receipt.json
          if-no-files-found: warn
          retention-days: 90
