# ng-runner-policy: private-jit-only-v1
name: Sync Unraid GHCR aliases
run-name: ${{ format('action:{0}:pool:{1}', inputs.action_tag, inputs.runner_pool_tag) }}

on:
  workflow_dispatch:
    inputs:
      action_tag:
        description: Action to run
        required: true
        type: choice
        options:
          - sync
      runner_pool_tag:
        description: Private ephemeral JIT runner pool
        required: true
        type: choice
        options:
          - private
permissions:
  contents: read

concurrency:
  group: slskr-unraid-ghcr-aliases
  cancel-in-progress: false

jobs:
  sync:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.repository == 'snapetech-org/slskr' &&
      github.ref == 'refs/heads/main'
    runs-on: ${{ fromJSON(format('{{"group":"ng-shared-main-jit","labels":["self-hosted","linux","x64","ng-shared-main-slskr","ng-main-run-{0}","gha-{0}-sync"]}}', github.run_id)) }}
    timeout-minutes: 10
    permissions:
      contents: read
      packages: read
    steps:
      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to the personal GHCR package
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: snapetech
          password: ${{ secrets.GHCR_LEGACY_TOKEN }}

      - name: Align stable tags to the latest published image
        shell: bash
        env:
          SOURCE_IMAGE: ghcr.io/snapetech/slskr
          TARGET_IMAGE: ghcr.io/snapetech/slskr
          SOURCE_TAG: latest
          ALIASES: latest main master
        run: |
          set -euo pipefail
          digest_for() {
            local image="$1" output digest
            if ! output="$(docker buildx imagetools inspect "$image" 2>&1)"; then
              printf 'Could not inspect %s:\n%s\n' "$image" "$output" >&2
              return 1
            fi
            digest="$(awk '$1 == "Digest:" { print $2; exit }' <<< "$output")"
            if [[ ! "$digest" =~ ^sha256:[a-f0-9]{64}$ ]]; then
              printf 'No valid manifest digest in inspect output for %s:\n%s\n' "$image" "$output" >&2
              return 1
            fi
            printf '%s\n' "$digest"
          }

          source_ref="${SOURCE_IMAGE}:${SOURCE_TAG}"
          if ! expected_digest="$(digest_for "$source_ref")"; then
            echo "Could not resolve the published stable image $source_ref." >&2
            exit 1
          fi

          for alias in $ALIASES; do
            target_ref="${TARGET_IMAGE}:${alias}"
            if [[ "$target_ref" != "$source_ref" ]]; then
              if ! create_output="$(docker buildx imagetools create --tag "$target_ref" "$source_ref" 2>&1)"; then
                printf 'Could not copy %s to %s:\n%s\n' "$source_ref" "$target_ref" "$create_output" >&2
                exit 1
              fi
            fi
            if ! actual_digest="$(digest_for "$target_ref")"; then
              printf 'Could not verify destination image %s.\n' "$target_ref" >&2
              exit 1
            fi
            if [[ "$actual_digest" != "$expected_digest" ]]; then
              echo "$target_ref points to $actual_digest; expected $expected_digest." >&2
              exit 1
            fi
          done
          echo "Verified Unraid GHCR aliases against $source_ref ($expected_digest)." >> "$GITHUB_STEP_SUMMARY"
