# Runner policy: compatible GitHub-hosted runners by default
name: slskr Web UI localization validation
run-name: ${{ format('action:{0}:pool:{1}', inputs.action_tag, inputs.runner_pool_tag) }}
on:
  workflow_call:
  workflow_dispatch:
    inputs:
      action_tag:
        description: Action to run
        required: true
        type: choice
        options:
          - test
      runner_pool_tag:
        description: GitHub-hosted runner pool
        required: true
        type: choice
        options: [hosted]
permissions:
  contents: read
jobs:
  web-assets:
    name: Web UI localization test
    if: >-
      (
        github.event_name != 'workflow_dispatch' ||
        (
          github.ref == 'refs/heads/main' &&
          inputs.action_tag == 'test' &&
          inputs.runner_pool_tag == 'hosted'
        )
      ) &&
      (
        true
      )
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.23.4'
          package-manager-cache: false
      - name: Install patched npm CLI
        run: npm install --global npm@12.2.2 --no-audit --no-fund
      - name: Install web dependencies
        run: npm --prefix web ci --allow-git=root --legacy-peer-deps --no-audit --no-fund
      - name: Test Web UI localization coverage
        run: npm --prefix web test -- src/lib/interfaceLocale.test.js
