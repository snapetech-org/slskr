# ng-runner-policy: private-jit-only-v1
name: slskr fork PR localization check
on:
  workflow_call:
  push:
    tags:
      - '**'
permissions:
  contents: read
jobs:
  web-assets:
    name: Web UI localization test
    runs-on: ${{ github.event_name == 'pull_request' && fromJSON('{"group":"public-fork-jit","labels":["self-hosted","linux","x64","public-pr-slskr"]}') || fromJSON(format('{{"group":"ng-shared-main-jit","labels":["self-hosted","linux","x64","ng-shared-main-slskr","ng-main-run-{0}","gha-{0}-web-assets"]}}', github.run_id)) }}
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.23.4'
          package-manager-cache: false
      - name: Install web dependencies
        run: npm --prefix web ci --allow-git=root --legacy-peer-deps --no-audit --no-fund
      - name: Test Web UI localization coverage
        run: npm --prefix web test -- src/lib/interfaceLocale.test.js
