# Runner policy: compatible GitHub-hosted runners by default
name: Windows Smoke
run-name: ${{ format('action:{0}:pool:{1}', inputs.action_tag, inputs.runner_pool_tag) }}

on:
  workflow_dispatch:
    inputs:
      action_tag:
        description: Action to run
        required: true
        type: choice
        options:
          - test
      runner_pool_tag:
        description: GitHub-hosted runner pool
        required: true
        type: choice
        options: [hosted]
concurrency:
  group: ${{ github.workflow }}-${{ github.run_id }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_NET_GIT_FETCH_WITH_CLI: true

jobs:
  rust:
    if: >-
      (
        github.event_name != 'workflow_dispatch' ||
        (
          github.ref == 'refs/heads/main' &&
          inputs.action_tag == 'test' &&
          inputs.runner_pool_tag == 'hosted'
        )
      ) &&
      (
        true
      )
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout@v6
        with:
          fetch-depth: 2

      - name: Enable Windows long paths for Git dependencies
        run: git config --global core.longpaths true

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.94.0
          components: clippy,rustfmt
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@c8037a86dde8214a8310e9f54a8fc61ab362aa31 # Swatinem/rust-cache@v2

      - name: Prefer rustup toolchain binaries
        shell: bash
        run: dirname "$(rustup which cargo)" >> "$GITHUB_PATH"

      - name: Select full Perl for vendored OpenSSL
        shell: pwsh
        run: ./scripts/select-windows-perl.ps1

      - name: Clear Unix compiler wrapper
        shell: pwsh
        run: |
          'RUSTC_WRAPPER=' | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          'CARGO_BUILD_RUSTC_WRAPPER=' | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # actions/setup-node@v7.1.0
        with:
          node-version: "22.23.4"
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            dashboard/package-lock.json
            client-ts/package-lock.json

      - name: Process memory guard
        shell: bash
        run: scripts/check-process-memory-guard.sh

      - name: Process memory guard regression
        shell: bash
        run: scripts/test-process-memory-guard.sh

      - name: Rust fmt
        shell: bash
        run: scripts/check-rust-format.sh

      - name: Rust tests
        shell: bash
        run: cargo test --locked --workspace

      - name: WASM check
        shell: bash
        run: cargo check --locked -p slskr-web --target wasm32-unknown-unknown

      - name: Web build
        run: |
          npm --prefix web ci --allow-git=root --legacy-peer-deps --no-audit --no-fund
          npm --prefix web run build

      - name: Build portable executable with static Visual C++ runtime
        shell: bash
        run: |
          SLSKR_APP_VERSION="runtime-check-${GITHUB_SHA}" cargo build --locked --release -p slskr --target x86_64-pc-windows-msvc
          python3 scripts/check-windows-runtime.py target/x86_64-pc-windows-msvc/release/slskr.exe
      - name: Scan the portable runtime build
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'portable-runtime-check.zip'
          Compress-Archive -Path target/x86_64-pc-windows-msvc/release/slskr.exe -DestinationPath $archive
          ./scripts/scan-windows-release.ps1 -Archive $archive
      - name: Run the portable executable
        shell: pwsh
        run: |
          & ./target/x86_64-pc-windows-msvc/release/slskr.exe version
          if ($LASTEXITCODE -ne 0) { throw 'Portable executable failed to start' }
      - name: Retain portable executable verification
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # actions/upload-artifact@v7.0.2
        with:
          name: windows-portable-runtime-${{ github.run_id }}
          path: target/x86_64-pc-windows-msvc/release/slskr.exe
          if-no-files-found: error
          retention-days: 7
