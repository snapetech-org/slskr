# ng-runner-policy: private-jit-only-v1
# packer-windows-jit-v1
name: Windows Smoke
run-name: ${{ (github.event_name == 'workflow_dispatch' && inputs.pr_number != '' && inputs.pr_sha != '' && inputs.target_run_id != '' && inputs.action_tag == 'ci' && inputs.runner_pool_tag == 'private' &&
    format('owner-pr:{0}:{1}:{2}:action:{3}:pool:{4}', inputs.pr_number, inputs.pr_sha, inputs.target_run_id, inputs.action_tag, inputs.runner_pool_tag)) ||
    (github.event_name == 'pull_request_target' && 'owner-pr-label-event') ||
    (github.event_name == 'workflow_dispatch' && format('action:{0}:pool:{1}', inputs.action_tag, inputs.runner_pool_tag)) || github.workflow }}

on:
  pull_request_target:
    branches: [main]
    types: [labeled]
  workflow_dispatch:
    inputs:
      action_tag:
        description: Action to run
        required: true
        default: test
        type: choice
        options:
          - test
          - ci
      runner_pool_tag:
        description: Private ephemeral JIT runner pool
        required: true
        default: private
        type: choice
        options:
          - private
      pr_number:
        description: Trusted owner PR number (set only by the metadata dispatcher)
        required: false
        type: string
      pr_sha:
        description: Exact owner PR head SHA
        required: false
        type: string
      target_run_id:
        description: Successful metadata-only pull_request_target run ID
        required: false
        type: string
concurrency:
  group: ${{ github.workflow }}-${{ github.run_id }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_NET_GIT_FETCH_WITH_CLI: true

jobs:
  dispatch-owner-pr:
    name: Dispatch trusted owner PR validation
    if: >-
      github.event_name == 'pull_request_target' &&
      github.event.action == 'labeled' &&
      github.actor == 'snapetech' &&
      github.event.pull_request.user.login == 'snapetech' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.repo.id == github.repository_id &&
      github.event.pull_request.base.ref == 'main' &&
      (github.event.label.name == 'action:ci' || github.event.label.name == 'pool:private') &&
      contains(github.event.pull_request.labels.*.name, 'action:ci') &&
      contains(github.event.pull_request.labels.*.name, 'pool:private')
    runs-on: ${{ fromJSON(format('{{"group":"ng-shared-main-jit","labels":["self-hosted","linux","x64","ng-shared-main-packer","ng-main-run-{0}","gha-{0}-owner-pr-dispatcher"]}}', github.run_id)) }}
    permissions:
      actions: write
      contents: none
    steps:
      - name: Dispatch the requested action from main
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_SHA: ${{ github.event.pull_request.head.sha }}
          TARGET_RUN_ID: ${{ github.run_id }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import json, os, re
          from urllib.request import Request, urlopen
          expected = 'snapetech-org/slskr'
          repository = os.environ['GITHUB_REPOSITORY']
          number = os.environ['PR_NUMBER']
          sha = os.environ['PR_SHA'].lower()
          target = os.environ['TARGET_RUN_ID']
          if repository.lower() != expected or not re.fullmatch(r'[1-9][0-9]*', number) or not re.fullmatch(r'[0-9a-f]{40}', sha) or not re.fullmatch(r'[1-9][0-9]*', target):
              raise SystemExit('invalid owner PR claim')
          payload = json.dumps({"ref": "main", 'inputs': {'action_tag': 'ci', 'runner_pool_tag': 'private', 'pr_number': number, 'pr_sha': sha, 'target_run_id': target}}).encode()
          request = Request('https://api.github.com/repos/snapetech-org/slskr/actions/workflows/windows-smoke.yml/dispatches', data=payload, headers={'Accept': 'application/vnd.github+json', 'Authorization': f"Bearer {os.environ['GH_TOKEN']}", 'Content-Type': 'application/json', 'X-GitHub-Api-Version': '2022-11-28'}, method='POST')
          with urlopen(request, timeout=20) as response:
              if response.status != 204:
                  raise SystemExit(f'dispatch HTTP {response.status}')
          PY

  rust:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' &&
      inputs.runner_pool_tag == 'private' &&
      ((inputs.action_tag == 'test' && inputs.pr_number == '' && inputs.pr_sha == '' && inputs.target_run_id == '') ||
       (inputs.action_tag == 'ci' && (github.actor == 'snapetech' || github.actor == 'github-actions[bot]') &&
        inputs.pr_number != '' && inputs.pr_sha != '' && inputs.target_run_id != ''))
    runs-on: ${{ fromJSON(format('{{"group":"packer-windows","labels":["self-hosted","Windows","X64","packer-windows","ng-shared-main-slskr","ng-main-run-{0}","gha-{0}-rust"]}}', github.run_id)) }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout@v6
        with:
          ref: ${{ inputs.pr_sha != '' && inputs.pr_sha || github.sha }}
          persist-credentials: false
          fetch-depth: 2

      - name: Enable Windows long paths for Git dependencies
        run: git config --global core.longpaths true

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.94.0
          components: clippy,rustfmt
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # Swatinem/rust-cache@v2

      - name: Prefer rustup toolchain binaries
        shell: bash
        run: dirname "$(rustup which cargo)" >> "$GITHUB_PATH"

      - name: Select full Perl for vendored OpenSSL
        shell: pwsh
        run: ./scripts/select-windows-perl.ps1

      - name: Clear Unix compiler wrapper
        shell: pwsh
        run: |
          'RUSTC_WRAPPER=' | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          'CARGO_BUILD_RUSTC_WRAPPER=' | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # actions/setup-node@v7.1.0
        with:
          node-version: "22.23.4"
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            dashboard/package-lock.json
            client-ts/package-lock.json

      - name: Process memory guard
        shell: bash
        run: scripts/check-process-memory-guard.sh

      - name: Process memory guard regression
        shell: bash
        run: scripts/test-process-memory-guard.sh

      - name: Rust fmt
        shell: bash
        run: scripts/check-rust-format.sh

      - name: Rust tests
        shell: bash
        run: cargo test --locked --workspace

      - name: WASM check
        shell: bash
        run: cargo check --locked -p slskr-web --target wasm32-unknown-unknown

      - name: Web build
        run: |
          npm --prefix web ci --allow-git=root --legacy-peer-deps --no-audit --no-fund
          npm --prefix web run build

  report-owner-pr:
    name: Report trusted owner PR validation
    needs: [rust]
    if: >-
      always() &&
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' &&
      inputs.action_tag == 'ci' && inputs.runner_pool_tag == 'private' &&
      github.actor == 'github-actions[bot]' &&
      inputs.pr_number != '' && inputs.pr_sha != '' && inputs.target_run_id != ''
    runs-on: ${{ fromJSON(format('{{"group":"ng-shared-main-jit","labels":["self-hosted","linux","x64","ng-shared-main-slskr","ng-main-run-{0}","gha-{0}-owner-pr-reporter"]}}', github.run_id)) }}
    permissions:
      checks: write
      pull-requests: read
      contents: none
    steps:
      - name: Attach exact-head validation result
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pr_number }}
          PR_SHA: ${{ inputs.pr_sha }}
          REPOSITORY: ${{ github.repository }}
          REPOSITORY_ID: ${{ github.repository_id }}
          VALIDATION_RUN_ID: ${{ github.run_id }}
          VALIDATION_RESULT: ${{ needs.rust.result }}
        run: |
          python3 - <<'PY'
          import json, os, re
          from urllib.request import Request, urlopen
          number = os.environ['PR_NUMBER']
          sha = os.environ['PR_SHA'].lower()
          repository = os.environ['REPOSITORY']
          repository_id = int(os.environ['REPOSITORY_ID'])
          if repository.lower() != 'snapetech-org/slskr' or not re.fullmatch(r'[1-9][0-9]*', number) or not re.fullmatch(r'[0-9a-f]{40}', sha):
              raise SystemExit('invalid PR check claim')
          pr_request = Request(f'https://api.github.com/repos/{repository}/pulls/{number}', headers={'Accept': 'application/vnd.github+json', 'Authorization': f"Bearer {os.environ['GH_TOKEN']}", 'X-GitHub-Api-Version': '2022-11-28'})
          with urlopen(pr_request, timeout=20) as response:
              current_pr = json.load(response)
          head_repo = current_pr.get('head', {}).get('repo') or {}
          if current_pr.get('state') != 'open' or current_pr.get('user', {}).get('login') != 'snapetech' or current_pr.get('base', {}).get('ref') != 'main' or current_pr.get('head', {}).get('sha', '').lower() != sha or (head_repo.get('full_name') or '').lower() != repository.lower() or head_repo.get('id') != repository_id:
              raise SystemExit('PR head is no longer the dispatched head')
          result = os.environ['VALIDATION_RESULT']
          conclusion = 'success' if result == 'success' else 'failure'
          run_id = os.environ['VALIDATION_RUN_ID']
          summary = f'Main-pinned, no-secret Windows owner PR validation: rust={result}'
          payload = json.dumps({'name': 'SlskR Windows owner PR validation', 'head_sha': sha, 'external_id': run_id, 'status': 'completed', 'conclusion': conclusion, 'details_url': 'https://github.com/snapetech-org/slskr/actions/runs/' + run_id, 'output': {'title': 'Owner PR validation ' + conclusion, 'summary': summary}}).encode()
          request = Request(f'https://api.github.com/repos/{repository}/check-runs', data=payload, headers={'Accept': 'application/vnd.github+json', 'Authorization': f"Bearer {os.environ['GH_TOKEN']}", 'Content-Type': 'application/json', 'X-GitHub-Api-Version': '2022-11-28'}, method='POST')
          with urlopen(request, timeout=20) as response:
              if response.status not in {201, 202}:
                  raise SystemExit(f'check HTTP {response.status}')
          PY
