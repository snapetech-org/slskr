# ng-runner-policy: private-jit-only-v1
name: Live Parity
run-name: ${{ format('action:{0}:pool:{1}', inputs.action_tag, inputs.runner_pool_tag) }}

env:
  WASM_BINDGEN_CLI_VERSION: 0.2.120

on:
  workflow_dispatch:
    inputs:
      action_tag:
        description: Action to run
        required: true
        type: choice
        options:
          - test
      runner_pool_tag:
        description: Private ephemeral JIT runner pool
        required: true
        type: choice
        options:
          - private
permissions:
  contents: read

concurrency:
  group: live-parity-${{ github.ref }}
  cancel-in-progress: false

jobs:
  rust-ui-and-slskd-api:
    name: Rust UI and slskd API parity
    runs-on: ${{ fromJSON(format('{{"group":"ng-shared-main-jit","labels":["self-hosted","linux","x64","ng-shared-main-slskr","ng-main-run-{0}","gha-{0}-rust-ui-and-slskd-api"]}}', github.run_id)) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout@v6
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.94.0
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@c8037a86dde8214a8310e9f54a8fc61ab362aa31 # Swatinem/rust-cache@v2
      - name: Prefer rustup toolchain binaries
        run: dirname "$(rustup which cargo)" >> "$GITHUB_PATH"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # actions/setup-node@v7.1.0
        with:
          node-version: '22.23.4'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # actions/setup-python@v7.1.0
        with:
          python-version: '3.12'
      - name: Install system tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y ripgrep
          cargo install wasm-bindgen-cli --version "$WASM_BINDGEN_CLI_VERSION" --locked --force
      - name: Install web dependencies
        run: npm --prefix web ci --allow-git=root --legacy-peer-deps
      - name: Install Playwright browsers
        run: npm --prefix web exec playwright install --with-deps chromium
      - name: Rust web UI headless parity audit
        run: node scripts/audit-rust-web-ui.mjs
      - name: slskd API automation compatibility smoke
        env:
          SLSKR_SLSKD_API_SMOKE_DIR: target/slskd-api-smoke
          SLSKR_SLSKD_API_SMOKE_TOKEN: live-parity-${{ github.run_id }}-${{ github.run_attempt }}
        run: scripts/run-slskd-api-compat-smoke.sh
      - name: Upload parity artifacts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # actions/upload-artifact@v7.0.2
        with:
          name: live-parity-${{ github.run_id }}
          path: |
            target/ux-audit/**
            target/slskr-web/**
            target/slskd-api-smoke/compatibility-summary.txt
          if-no-files-found: ignore

  credentialed-live-interop:
    name: Credentialed public live interop
    runs-on: ${{ fromJSON(format('{{"group":"ng-shared-main-jit","labels":["self-hosted","linux","x64","ng-shared-main-slskr","ng-main-run-{0}","gha-{0}-credentialed-live-interop"]}}', github.run_id)) }}
    env:
      SLSKR_LIVE_INTEROP_ENV: ${{ secrets.SLSKR_LIVE_INTEROP_ENV }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout@v6
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.94.0
      - uses: Swatinem/rust-cache@c8037a86dde8214a8310e9f54a8fc61ab362aa31 # Swatinem/rust-cache@v2
      - name: Prefer rustup toolchain binaries
        run: dirname "$(rustup which cargo)" >> "$GITHUB_PATH"
      - name: Build daemon for live interoperability
        run: cargo build --locked -p slskr
      - name: Prepare live credentials
        id: live-creds
        shell: bash
        run: |
          mkdir -p target/live-interop
          if [[ -z "${SLSKR_LIVE_INTEROP_ENV:-}" ]]; then
            printf 'timestamp\tcheck\tstatus\tdetail\n' > target/live-interop/credentialed-live-interop.tsv
            printf '%s\tcredentialed-live-interop\tskipped\tSLSKR_LIVE_INTEROP_ENV secret is not configured\n' "$(date -Is)" >> target/live-interop/credentialed-live-interop.tsv
            echo "configured=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          printf '%s\n' "$SLSKR_LIVE_INTEROP_ENV" > target/live-interop/live.env
          chmod 0600 target/live-interop/live.env
          echo "configured=true" >> "$GITHUB_OUTPUT"
      - name: Public live interop matrix
        if: steps.live-creds.outputs.configured == 'true'
        env:
          SLSKR_INTEROP_OUTPUT_DIR: target/live-interop
          SLSKR_LIVE_ENV_FILE: target/live-interop/live.env
        run: scripts/run-live-interop-matrix.sh
      - name: Upload public live interop artifacts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # actions/upload-artifact@v7.0.2
        with:
          name: credentialed-live-interop-${{ github.run_id }}
          path: target/live-interop/*.tsv
          if-no-files-found: error
