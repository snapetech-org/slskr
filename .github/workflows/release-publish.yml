# ng-runner-policy: hosted-first-v1
name: Publish Downstream Packages

on:
  workflow_call:
    inputs:
      tag:
        description: "Release tag to publish, for example v<semver>"
        required: true
        type: string
      publish_only:
        description: "Optional manual retry scope."
        required: false
        type: string
        default: all
    secrets:
      AUR_SSH_KEY:
        required: false
      COPR_LOGIN:
        required: false
      COPR_TOKEN:
        required: false
      COPR_KERBEROS_PRINCIPAL:
        required: false
      COPR_KERBEROS_KEYTAB_B64:
        required: false
      COPR_FEDORA_USERNAME:
        required: false
      COPR_FEDORA_PASSWORD:
        required: false
      COPR_FEDORA_OTP_SECRET:
        required: false
      GPG_PRIVATE_KEY:
        required: false
      LAUNCHPAD_SFTP_KEY:
        required: false
      LAUNCHPAD_SFTP_USER:
        required: false
      DOCKERHUB_USERNAME:
        required: false
      DOCKERHUB_TOKEN:
        required: false
      GHCR_TOKEN:
        required: true
      TAP_GITHUB_TOKEN:
        required: false
      WINGETCREATE_GITHUB_TOKEN:
        required: false
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish, for example v<semver>"
        required: true
      publish_only:
        description: "Manual recovery may only resubmit the Winget manifests from an existing stable release."
        required: true
        type: choice
        options:
          - winget
        default: winget

permissions:
  actions: read
  contents: write
  packages: write

env:
  DOCKERHUB_IMAGE: snapetech/slskr

jobs:
  metadata:
    name: Prepare Dynamic Release Metadata
    runs-on: ${{ (vars.NG_HOSTED_FIRST != 'true' || vars.NG_FORCE_JIT == 'true' || github.run_attempt > 1) && (contains(fromJSON('["push","workflow_dispatch","schedule","release","repository_dispatch"]'), github.event_name) && (github.ref == 'refs/heads/main' || (github.ref_type == 'tag' && startsWith(github.ref_name, 'v')))) && fromJSON(format('{{"group":"ng-shared-main-jit","labels":["self-hosted","linux","x64","ng-shared-main-slskr","ng-main-run-{0}"]}}', github.run_id)) || 'ubuntu-latest' }}
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      release_version: ${{ steps.version.outputs.release_version }}
      pkgver: ${{ steps.version.outputs.pkgver }}
      release_sha: ${{ steps.version.outputs.release_sha }}
    steps:
      - name: Require main source for manual publisher retries
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "Manual publisher retries must run from main." >&2
            exit 1
          fi
      - name: Require an existing published release for manual recovery
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.tag || github.event.inputs.tag || github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          release_json="$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json tagName,isDraft,isPrerelease)"
          jq -e --arg tag "$RELEASE_TAG" \
            '.tagName == $tag and .isDraft == false and .isPrerelease == false' \
            <<<"$release_json" >/dev/null || {
              echo "Manual Winget recovery requires an existing published stable release for $RELEASE_TAG." >&2
              exit 1
            }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.tag || github.event.inputs.tag || github.ref_name }}
      - name: Resolve version
        id: version
        env:
          RELEASE_TAG: ${{ inputs.tag || github.event.inputs.tag || github.event.release.tag_name }}
        shell: bash
        run: |
          set -euo pipefail
          . packaging/scripts/release-assets.sh
          tag="${RELEASE_TAG}"
          release_version="$(slskr_release_version_from_tag "$tag")"
          pkgver="${release_version#v}"
          release_sha="$(git rev-parse HEAD)"
          {
            echo "tag=${tag}"
            echo "release_version=${release_version}"
            echo "pkgver=${pkgver}"
            echo "release_sha=${release_sha}"
          } >> "$GITHUB_OUTPUT"
      - name: Download release assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          . packaging/scripts/release-assets.sh
          mkdir -p release-assets
          version="${{ steps.version.outputs.release_version }}"
          for asset in \
            "slskr-${version}-x86_64-unknown-linux-gnu.tar.gz" \
            "slskr-${version}-aarch64-unknown-linux-gnu.tar.gz" \
            "slskr-${version}-x86_64-unknown-linux-musl.tar.gz" \
            "slskr-${version}-aarch64-unknown-linux-musl.tar.gz" \
            "slskr-${version}-x86_64-apple-darwin.tar.gz" \
            "slskr-${version}-aarch64-apple-darwin.tar.gz" \
            "slskr-${version}-x86_64-pc-windows-msvc.zip"; do
            slskr_wait_for_asset "${{ steps.version.outputs.tag }}" "$asset" "release-assets/$asset"
          done
      - name: Update metadata from asset hashes
        shell: bash
        run: packaging/scripts/update-release-metadata.sh "${{ steps.version.outputs.tag }}" release-assets
      - name: Upload metadata
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # actions/upload-artifact@v7.0.2
        with:
          name: slskr-release-metadata
          path: |
            packaging/
          if-no-files-found: error

  aur:
    name: Publish AUR
    if: ${{ inputs.publish_only != 'winget' }}
    needs: metadata
    runs-on: ${{ contains(fromJSON('["push","workflow_dispatch","schedule","release","repository_dispatch"]'), github.event_name) && (github.ref == 'refs/heads/main' || (github.ref_type == 'tag' && startsWith(github.ref_name, 'v'))) && fromJSON(format('{{"group":"ng-shared-main-jit","labels":["self-hosted","linux","x64","ng-shared-main-slskr","ng-main-run-{0}"]}}', github.run_id)) || 'ubuntu-latest' }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.tag || github.event.inputs.tag || github.ref_name }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # actions/download-artifact@v8.0.2
        with:
          name: slskr-release-metadata
          path: packaging
      - name: Validate hashes
        run: bash packaging/scripts/validate-aur-pkgbuild-hashes.sh packaging/aur/PKGBUILD packaging/aur/PKGBUILD-bin
      - name: Smoke-check AUR sources
        run: scripts/check-aur-package-smoke.sh
      - name: Setup AUR SSH
        env:
          AUR_SSH_KEY: ${{ secrets.AUR_SSH_KEY }}
        run: |
          set -euo pipefail
          if [[ -z "${AUR_SSH_KEY:-}" ]]; then
            echo "AUR_SSH_KEY is not configured; skipping AUR publish."
            exit 0
          fi
          tmp_key="$(mktemp)"
          trap 'rm -f "$tmp_key"' EXIT
          printf '%s\n' "$AUR_SSH_KEY" > "$tmp_key"
          bash packaging/scripts/setup-aur-ssh.sh "$tmp_key"
      - name: Push slskr-bin
        env:
          AUR_SSH_KEY: ${{ secrets.AUR_SSH_KEY }}
        run: |
          set -euo pipefail
          [[ -n "${AUR_SSH_KEY:-}" ]] || exit 0
          bash packaging/scripts/checkout-aur-repo.sh slskr-bin aur-slskr-bin
          rm -f aur-slskr-bin/slskr.install
          cp packaging/aur/PKGBUILD-bin aur-slskr-bin/PKGBUILD
          cp packaging/aur/slskr.{service,sysusers,tmpfiles} aur-slskr-bin/
          bash packaging/scripts/generate-aur-srcinfo.sh aur-slskr-bin/PKGBUILD > aur-slskr-bin/.SRCINFO
          (cd aur-slskr-bin && git add -A)
          bash packaging/scripts/push-aur-repo.sh aur-slskr-bin slskr-bin "Update to ${{ needs.metadata.outputs.tag }}"
      - name: Push slskr source package
        env:
          AUR_SSH_KEY: ${{ secrets.AUR_SSH_KEY }}
        run: |
          set -euo pipefail
          [[ -n "${AUR_SSH_KEY:-}" ]] || exit 0
          bash packaging/scripts/checkout-aur-repo.sh slskr aur-slskr
          rm -f aur-slskr/slskr.install
          cp packaging/aur/PKGBUILD aur-slskr/PKGBUILD
          cp packaging/aur/slskr.{service,sysusers,tmpfiles} aur-slskr/
          bash packaging/scripts/generate-aur-srcinfo.sh aur-slskr/PKGBUILD > aur-slskr/.SRCINFO
          (cd aur-slskr && git add -A)
          bash packaging/scripts/push-aur-repo.sh aur-slskr slskr "Update to ${{ needs.metadata.outputs.tag }}"

  copr:
    name: Publish COPR
    if: ${{ inputs.publish_only != 'winget' }}
    needs: metadata
    runs-on: ${{ contains(fromJSON('["push","workflow_dispatch","schedule","release","repository_dispatch"]'), github.event_name) && (github.ref == 'refs/heads/main' || (github.ref_type == 'tag' && startsWith(github.ref_name, 'v'))) && fromJSON(format('{{"group":"ng-shared-main-jit","labels":["self-hosted","linux","x64","ng-shared-main-slskr","ng-main-run-{0}"]}}', github.run_id)) || 'ubuntu-latest' }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.tag || github.event.inputs.tag || github.ref_name }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # actions/download-artifact@v8.0.2
        with:
          name: slskr-release-metadata
          path: packaging
      - name: Download Linux assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          . packaging/scripts/release-assets.sh
          mkdir -p dist
          for target in x86_64 aarch64; do
            asset="slskr-${{ needs.metadata.outputs.release_version }}-${target}-unknown-linux-gnu.tar.gz"
            slskr_wait_for_asset "${{ needs.metadata.outputs.tag }}" "$asset" "dist/$asset"
          done
      - name: Install COPR tooling
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y ca-certificates krb5-user libkrb5-dev oathtool rpm python3-pip python3-venv
          python3 -m venv /tmp/slskr-copr
          /tmp/slskr-copr/bin/python -m pip install --upgrade pip
          /tmp/slskr-copr/bin/python -m pip install copr-cli requests-gssapi rich
          echo /tmp/slskr-copr/bin >> "$GITHUB_PATH"
      - name: Configure COPR
        env:
          COPR_LOGIN: ${{ secrets.COPR_LOGIN }}
          COPR_TOKEN: ${{ secrets.COPR_TOKEN }}
          COPR_KERBEROS_PRINCIPAL: ${{ secrets.COPR_KERBEROS_PRINCIPAL }}
          COPR_KERBEROS_KEYTAB_B64: ${{ secrets.COPR_KERBEROS_KEYTAB_B64 }}
          COPR_FEDORA_USERNAME: ${{ secrets.COPR_FEDORA_USERNAME }}
          COPR_FEDORA_PASSWORD: ${{ secrets.COPR_FEDORA_PASSWORD }}
          COPR_FEDORA_OTP_SECRET: ${{ secrets.COPR_FEDORA_OTP_SECRET }}
        run: |
          set -euo pipefail
          mkdir -p ~/.config

          if [[ -n "${COPR_KERBEROS_PRINCIPAL:-}" && -n "${COPR_KERBEROS_KEYTAB_B64:-}" ]]; then
            sudo install -d -m 0755 /etc/ipa
            curl -fsSL https://id.fedoraproject.org/ipa/config/ca.crt | sudo tee /etc/ipa/ca.crt >/dev/null
            sudo install -d -m 0755 /etc/krb5.conf.d
            sudo tee /etc/krb5.conf.d/fedoraproject_org >/dev/null <<'EOF'
          [realms]
           FEDORAPROJECT.ORG = {
            kdc = https://id.fedoraproject.org/KdcProxy
            pkinit_anchors = FILE:/etc/ipa/ca.crt
           }

          [domain_realm]
           .fedoraproject.org = FEDORAPROJECT.ORG
           fedoraproject.org = FEDORAPROJECT.ORG
          EOF
            sudo sed -i '/^\[libdefaults\]/a\  dns_lookup_realm = false\n  rdns = false\n  dns_canonicalize_hostname = false' /etc/krb5.conf

            keytab="$RUNNER_TEMP/copr.keytab"
            ccache="$RUNNER_TEMP/copr.krb5cc"
            printf '%s' "$COPR_KERBEROS_KEYTAB_B64" | base64 -d > "$keytab"
            chmod 0600 "$keytab"
            KRB5CCNAME="FILE:$ccache" kinit -kt "$keytab" "$COPR_KERBEROS_PRINCIPAL"
            rm -f "$keytab"
            echo "KRB5CCNAME=FILE:$ccache" >> "$GITHUB_ENV"
            cat > ~/.config/copr <<EOF
          [copr-cli]
          username = slskdn
          copr_url = https://copr.fedorainfracloud.org
          gssapi = true
          EOF
            echo "Configured COPR with Kerberos/GSSAPI."
          # Prefer Fedora password+TOTP credentials over the API token, which
          # can expire while the account credentials remain valid.
          elif [[ -n "${COPR_LOGIN:-}" && -n "${COPR_TOKEN:-}" ]] \
            && [[ -z "${COPR_FEDORA_USERNAME:-}" || -z "${COPR_FEDORA_PASSWORD:-}" || -z "${COPR_FEDORA_OTP_SECRET:-}" ]]; then
            cat > ~/.config/copr <<EOF
          [copr-cli]
          login = ${COPR_LOGIN}
          username = slskdn
          token = ${COPR_TOKEN}
          copr_url = https://copr.fedorainfracloud.org
          EOF
            echo "Configured COPR with API token fallback."
          elif [[ -n "${COPR_FEDORA_USERNAME:-}" && -n "${COPR_FEDORA_PASSWORD:-}" && -n "${COPR_FEDORA_OTP_SECRET:-}" ]]; then
            sudo install -d -m 0755 /etc/ipa
            curl -fsSL https://id.fedoraproject.org/ipa/config/ca.crt | sudo tee /etc/ipa/ca.crt >/dev/null
            sudo install -d -m 0755 /etc/krb5.conf.d
            sudo tee /etc/krb5.conf.d/fedoraproject_org >/dev/null <<'EOF'
          [realms]
           FEDORAPROJECT.ORG = {
            kdc = https://id.fedoraproject.org/KdcProxy
            pkinit_anchors = FILE:/etc/ipa/ca.crt
           }

          [domain_realm]
           .fedoraproject.org = FEDORAPROJECT.ORG
           fedoraproject.org = FEDORAPROJECT.ORG
          EOF
            sudo sed -i '/^\[libdefaults\]/a\  dns_lookup_realm = false\n  rdns = false\n  dns_canonicalize_hostname = false' /etc/krb5.conf

            ccache="$RUNNER_TEMP/copr.krb5cc"
            armor="$RUNNER_TEMP/copr.krb5cc.armor"
            otp="$(oathtool --totp --base32 "$COPR_FEDORA_OTP_SECRET")"
            if KRB5CCNAME="FILE:$armor" kinit -n @FEDORAPROJECT.ORG >/dev/null 2>&1 \
              && printf '%s%s\n' "$COPR_FEDORA_PASSWORD" "$otp" \
                | KRB5CCNAME="FILE:$ccache" kinit -T "FILE:$armor" "${COPR_FEDORA_USERNAME}@FEDORAPROJECT.ORG"; then
              KRB5CCNAME="FILE:$armor" kdestroy || true
              echo "KRB5CCNAME=FILE:$ccache" >> "$GITHUB_ENV"
              cat > ~/.config/copr <<EOF
          [copr-cli]
          username = slskdn
          copr_url = https://copr.fedorainfracloud.org
          gssapi = true
          EOF
              echo "Configured COPR with Fedora password+TOTP Kerberos/GSSAPI."
            elif [[ -n "${COPR_LOGIN:-}" && -n "${COPR_TOKEN:-}" ]]; then
              rm -f "$ccache" "$armor"
              cat > ~/.config/copr <<EOF
          [copr-cli]
          login = ${COPR_LOGIN}
          username = slskdn
          token = ${COPR_TOKEN}
          copr_url = https://copr.fedorainfracloud.org
          EOF
              echo "::warning::COPR Kerberos authentication failed; trying the configured API token fallback."
            else
              echo "::error title=COPR authentication failed::Fedora password+TOTP authentication failed and no COPR API token fallback is configured."
              exit 1
            fi
          else
            echo "COPR credentials not configured; skipping."
          fi
      - name: Build and upload SRPM
        env:
          COPR_LOGIN: ${{ secrets.COPR_LOGIN }}
          COPR_TOKEN: ${{ secrets.COPR_TOKEN }}
          COPR_KERBEROS_PRINCIPAL: ${{ secrets.COPR_KERBEROS_PRINCIPAL }}
          COPR_KERBEROS_KEYTAB_B64: ${{ secrets.COPR_KERBEROS_KEYTAB_B64 }}
          COPR_FEDORA_USERNAME: ${{ secrets.COPR_FEDORA_USERNAME }}
          COPR_FEDORA_PASSWORD: ${{ secrets.COPR_FEDORA_PASSWORD }}
          COPR_FEDORA_OTP_SECRET: ${{ secrets.COPR_FEDORA_OTP_SECRET }}
        run: |
          set -euo pipefail
          if [[ -z "${COPR_KERBEROS_PRINCIPAL:-}" || -z "${COPR_KERBEROS_KEYTAB_B64:-}" ]] \
            && [[ -z "${COPR_FEDORA_USERNAME:-}" || -z "${COPR_FEDORA_PASSWORD:-}" || -z "${COPR_FEDORA_OTP_SECRET:-}" ]] \
            && [[ -z "${COPR_LOGIN:-}" || -z "${COPR_TOKEN:-}" ]]; then
            exit 0
          fi
          if ! copr-cli whoami >/dev/null 2>&1; then
            echo "::error title=COPR authentication failed::copr-cli could not authenticate. Renew the configured COPR Kerberos keytab or Fedora password+TOTP credentials; use COPR_LOGIN and COPR_TOKEN only as the last fallback."
            exit 1
          fi
          version="${{ needs.metadata.outputs.pkgver }}"
          rpm_top="$(mktemp -d "/tmp/slskr-rpmbuild-${version}.XXXXXX")"
          mkdir -p "$rpm_top"/{SOURCES,SPECS,SRPMS}
          cp dist/slskr-${{ needs.metadata.outputs.release_version }}-*-unknown-linux-gnu.tar.gz "$rpm_top/SOURCES/"
          cp packaging/aur/slskr.service "$rpm_top/SOURCES/"
          cp packaging/aur/slskr.sysusers "$rpm_top/SOURCES/"
          cp packaging/aur/slskr.tmpfiles "$rpm_top/SOURCES/"
          cp packaging/rpm/slskr.spec "$rpm_top/SPECS/"
          rpmbuild -bs "$rpm_top/SPECS/slskr.spec" --define "_topdir $rpm_top"
          srpm="$rpm_top/SRPMS/slskr-${version}-1.src.rpm"
          test -f "$srpm"
          cp "$srpm" "dist/slskr-${version}-1.src.rpm"
          chroots=(
            fedora-43-x86_64
            fedora-43-aarch64
            fedora-rawhide-x86_64
            fedora-rawhide-aarch64
          )
          if ! copr-cli get slskr >/dev/null 2>&1; then
            copr-cli create slskr \
              --chroot "${chroots[0]}" \
              --chroot "${chroots[1]}" \
              --chroot "${chroots[2]}" \
              --chroot "${chroots[3]}" \
              --description "slskr RPM builds" \
              --instructions "dnf copr enable slskdn/slskr && dnf install slskr"
          else
            copr-cli modify slskr \
              --chroot "${chroots[0]}" \
              --chroot "${chroots[1]}" \
              --chroot "${chroots[2]}" \
              --chroot "${chroots[3]}"
          fi
          copr-cli build slskr "dist/slskr-${version}-1.src.rpm" --nowait

  ppa:
    name: Publish Launchpad PPA
    if: ${{ inputs.publish_only != 'winget' }}
    needs: metadata
    runs-on: ${{ contains(fromJSON('["push","workflow_dispatch","schedule","release","repository_dispatch"]'), github.event_name) && (github.ref == 'refs/heads/main' || (github.ref_type == 'tag' && startsWith(github.ref_name, 'v'))) && fromJSON(format('{{"group":"ng-shared-main-jit","labels":["self-hosted","linux","x64","ng-shared-main-slskr","ng-main-run-{0}"]}}', github.run_id)) || 'ubuntu-latest' }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.tag || github.event.inputs.tag || github.ref_name }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # actions/download-artifact@v8.0.2
        with:
          name: slskr-release-metadata
          path: packaging
      - name: Install Debian tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y devscripts debhelper gnupg dput
      - name: Import signing key
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          if [[ -z "${GPG_PRIVATE_KEY:-}" ]]; then
            echo "GPG_PRIVATE_KEY not configured; skipping PPA."
            exit 0
          fi
          printf '%s\n' "$GPG_PRIVATE_KEY" | gpg --batch --import
          key_id="$(gpg --list-secret-keys --keyid-format long | awk '/^sec/ { split($2,a,"/"); print a[2]; exit }')"
          echo "PPA_GPG_KEY=${key_id}" >> "$GITHUB_ENV"
      - name: Build source package
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ -n "${GPG_PRIVATE_KEY:-}" ]] || exit 0
          . packaging/scripts/release-assets.sh
          version="${{ needs.metadata.outputs.pkgver }}"
          release_version="${{ needs.metadata.outputs.release_version }}"
          for target in x86_64 aarch64; do
            asset="slskr-${release_version}-${target}-unknown-linux-gnu.tar.gz"
            slskr_wait_for_asset "${{ needs.metadata.outputs.tag }}" "$asset" "/tmp/$asset"
          done
          src="slskr-${version}"
          mkdir -p "$src/vendor" "$src/lib/systemd/system" "$src/usr/lib/sysusers.d" "$src/usr/lib/tmpfiles.d"
          cp /tmp/slskr-${release_version}-*-unknown-linux-gnu.tar.gz "$src/vendor/"
          cp packaging/aur/slskr.service "$src/lib/systemd/system/slskr.service"
          cp packaging/aur/slskr.sysusers "$src/usr/lib/sysusers.d/slskr.conf"
          cp packaging/aur/slskr.tmpfiles "$src/usr/lib/tmpfiles.d/slskr.conf"
          cp -R packaging/debian "$src/debian"
          # Launchpad rejects re-uploads of an upstream version whose orig
          # tarball differs byte-for-byte from one it already accepted. Pin
          # every nondeterministic field (member order, mtime, ownership,
          # gzip header) and anchor the timestamp to the release tag's commit
          # so the tarball is identical across reruns of the same release.
          epoch="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${{ needs.metadata.outputs.tag }}" \
            --jq '.commit.committer.date' 2>/dev/null | { read -r d && date -u -d "$d" +%s; } || true)"
          : "${epoch:=1577836800}"
          tar --exclude "$src/debian" \
            --sort=name --mtime="@${epoch}" \
            --owner=0 --group=0 --numeric-owner \
            --format=gnu -cf - "$src" \
            | gzip -n -9 > "slskr_${version}.orig.tar.gz"
          cd "$src"
          dch --package slskr --newversion "${version}-1ppa$(date +%Y%m%d%H%M)~jammy" --distribution jammy "Release ${{ needs.metadata.outputs.tag }}"
          debuild -S -sa -d -k"${PPA_GPG_KEY}"
      - name: Preflight Launchpad SFTP upload
        env:
          LAUNCHPAD_SFTP_KEY: ${{ secrets.LAUNCHPAD_SFTP_KEY }}
        run: |
          set -euo pipefail
          if [[ -z "${LAUNCHPAD_SFTP_KEY:-}" ]]; then
            echo "::error::LAUNCHPAD_SFTP_KEY is required; anonymous FTP fallback is disabled."
            exit 1
          fi
          echo "SLSKR_PPA_UPLOAD_METHOD=sftp" >> "$GITHUB_ENV"
      - name: Upload to PPA
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          LAUNCHPAD_SFTP_KEY: ${{ secrets.LAUNCHPAD_SFTP_KEY }}
          LAUNCHPAD_SFTP_USER: ${{ secrets.LAUNCHPAD_SFTP_USER }}
        run: |
          set -euo pipefail
          [[ -n "${GPG_PRIVATE_KEY:-}" ]] || exit 0
          changes="$(find . -maxdepth 1 -name '*.changes' -print -quit)"
          if [[ -z "$changes" ]]; then
            echo "::error::Unable to find source package .changes file"
            exit 1
          fi
          gpg --verify "$changes"
          dsc="$(awk '/\.dsc$/ { print $NF; exit }' "$changes")"
          if [[ -z "$dsc" || ! -f "$dsc" ]]; then
            echo "::error::Unable to find signed .dsc referenced by $changes"
            exit 1
          fi
          gpg --verify "$dsc"
          user="${LAUNCHPAD_SFTP_USER:-keefshape}"
          if [[ -z "${LAUNCHPAD_SFTP_KEY:-}" ]]; then
            echo "::error::LAUNCHPAD_SFTP_KEY is required; refusing insecure PPA upload."
            exit 1
          fi
          if [[ ! "$user" =~ ^[A-Za-z0-9][A-Za-z0-9._-]{0,63}$ ]]; then
            echo "::error::Invalid Launchpad SFTP username."
            exit 1
          fi
          install -d -m 0700 ~/.ssh
          printf '%s\n' "$LAUNCHPAD_SFTP_KEY" > ~/.ssh/launchpad_ppa
          chmod 0600 ~/.ssh/launchpad_ppa
          cat > ~/.ssh/known_hosts <<'EOF'
          ppa.launchpad.net ssh-rsa 
          EOF
          expected_fingerprint='SHA256:MGq+4hxD7RduVTcfwlwwboZnsgJC6SL/NltM8ye+gNg'
          actual_fingerprint="$(ssh-keygen -lf ~/.ssh/known_hosts -E sha256 | awk '{print $2}')"
          [[ "$actual_fingerprint" == "$expected_fingerprint" ]] || {
            echo 'Pinned Launchpad SSH host key fingerprint mismatch.' >&2
            exit 1
          }
          cat > ~/.ssh/config <<EOF
          Host ppa.launchpad.net
            HostName ppa.launchpad.net
            User ${user}
            IdentityFile ~/.ssh/launchpad_ppa
            IdentitiesOnly yes
            BatchMode yes
            PasswordAuthentication no
            KbdInteractiveAuthentication no
            NumberOfPasswordPrompts 0
            StrictHostKeyChecking yes
            UserKnownHostsFile ~/.ssh/known_hosts
            GlobalKnownHostsFile /dev/null
            ProxyCommand nc -X connect -x 10.0.2.100:3128 %h %p
            ConnectTimeout 60
            ServerAliveInterval 30
            ServerAliveCountMax 4
          EOF
          chmod 0600 ~/.ssh/config ~/.ssh/known_hosts
          cat > ~/.dput.cf <<EOF
          [slskr-ppa-sftp]
          fqdn = ppa.launchpad.net
          method = sftp
          incoming = ~keefshape/ubuntu/slskdn/
          login = ${user}
          # The .changes and .dsc were verified above; Launchpad also verifies them.
          allow_unsigned_uploads = 1
          EOF
          echo "Uploading $(basename "$changes") to Launchpad PPA over pinned SFTP"
          timeout --preserve-status 1800 dput --config ~/.dput.cf slskr-ppa-sftp "$changes"

  docker:
    name: Publish Docker Images
    if: ${{ inputs.publish_only != 'winget' }}
    needs: metadata
    runs-on: ${{ (vars.NG_HOSTED_FIRST != 'true' || vars.NG_FORCE_JIT == 'true' || github.run_attempt > 1) && (contains(fromJSON('["push","workflow_dispatch","schedule","release","repository_dispatch"]'), github.event_name) && (github.ref == 'refs/heads/main' || (github.ref_type == 'tag' && startsWith(github.ref_name, 'v')))) && fromJSON(format('{{"group":"ng-shared-main-jit","labels":["self-hosted","linux","x64","ng-shared-main-slskr","ng-main-run-{0}"]}}', github.run_id)) || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.tag || github.event.inputs.tag || github.ref_name }}
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # docker/setup-qemu-action@v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # docker/setup-buildx-action@v4.4.1
      - name: Require Docker Hub publisher credentials
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$DOCKERHUB_USERNAME" || -z "$DOCKERHUB_TOKEN" ]]; then
            echo 'Docker Hub publisher credentials are required for stable releases.' >&2
            exit 1
          fi
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: snapetech
          password: ${{ secrets.GHCR_TOKEN }}
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # docker/login-action@v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Prepare tags
        id: tags
        shell: bash
        run: |
          {
            echo "ghcr<<EOF"
            echo "ghcr.io/snapetech/slskr:${{ needs.metadata.outputs.release_version }}"
            echo "ghcr.io/snapetech/slskr:main"
            echo "ghcr.io/snapetech/slskr:master"
            echo "ghcr.io/snapetech/slskr:latest"
            echo "EOF"
            echo "dockerhub<<EOF"
            echo "${DOCKERHUB_IMAGE}:${{ needs.metadata.outputs.release_version }}"
            echo "${DOCKERHUB_IMAGE}:main"
            echo "${DOCKERHUB_IMAGE}:master"
            echo "${DOCKERHUB_IMAGE}:latest"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
      # ghcr is the registry users actually pull from and uses the personal
      # account that owns the package, so its publish must gate the release.
      - name: Build and push (ghcr)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # docker/build-push-action@v7
        with:
          file: packaging/docker/release.Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            VERSION=${{ needs.metadata.outputs.release_version }}
            REVISION=${{ needs.metadata.outputs.release_sha }}
            BUILD_DATE=${{ github.event.release.published_at || github.run_id }}
          tags: ${{ steps.tags.outputs.ghcr }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Verify pushed GHCR manifest
        env:
          IMAGE: ghcr.io/snapetech/slskr:${{ needs.metadata.outputs.release_version }}
        run: docker buildx imagetools inspect "$IMAGE"
      # Keep both registries on the same verified release before completing it.
      - name: Build and push (Docker Hub)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # docker/build-push-action@v7
        with:
          file: packaging/docker/release.Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            VERSION=${{ needs.metadata.outputs.release_version }}
            REVISION=${{ needs.metadata.outputs.release_sha }}
            BUILD_DATE=${{ github.event.release.published_at || github.run_id }}
          tags: ${{ steps.tags.outputs.dockerhub }}
          cache-from: type=gha
      - name: Smoke-test published container shutdown
        env:
          IMAGE: ghcr.io/snapetech/slskr:${{ needs.metadata.outputs.release_version }}
        run: bash scripts/run-container-shutdown-smoke.sh "$IMAGE"

  homebrew:
    name: Update Homebrew Tap
    if: ${{ inputs.publish_only != 'winget' }}
    needs: metadata
    runs-on: ${{ (vars.NG_HOSTED_FIRST != 'true' || vars.NG_FORCE_JIT == 'true' || github.run_attempt > 1) && (contains(fromJSON('["push","workflow_dispatch","schedule","release","repository_dispatch"]'), github.event_name) && (github.ref == 'refs/heads/main' || (github.ref_type == 'tag' && startsWith(github.ref_name, 'v')))) && fromJSON(format('{{"group":"ng-shared-main-jit","labels":["self-hosted","linux","x64","ng-shared-main-slskr","ng-main-run-{0}"]}}', github.run_id)) || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.tag || github.event.inputs.tag || github.ref_name }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # actions/download-artifact@v8.0.2
        with:
          name: slskr-release-metadata
          path: packaging
      - name: Push tap
        env:
          GH_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "${GH_TOKEN:-}" ]]; then
            echo "TAP_GITHUB_TOKEN not configured; skipping Homebrew tap."
            exit 0
          fi
          git clone "https://x-access-token:${GH_TOKEN}@github.com/snapetech/homebrew-slskdn.git" tap
          mkdir -p tap/Formula
          cp packaging/homebrew/Formula/slskr.rb tap/Formula/slskr.rb
          cd tap
          git config user.name "slskr CI"
          git config user.email "slskr@proton.me"
          git add Formula/slskr.rb
          git commit -m "Update slskr to ${{ needs.metadata.outputs.release_version }}" || exit 0
          git push

  winget:
    name: Submit Winget PR
    needs: metadata
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.tag || github.event.inputs.tag || github.ref_name }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # actions/download-artifact@v8.0.2
        with:
          name: slskr-release-metadata
          path: packaging
      - name: Checkout publisher logic pinned to this manual retry
        if: github.event_name == 'workflow_dispatch'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          path: release-publisher
          sparse-checkout: scripts
          sparse-checkout-cone-mode: true
      - name: Submit manifests
        env:
          WINGETCREATE_GITHUB_TOKEN: ${{ secrets.WINGETCREATE_GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          if ([string]::IsNullOrWhiteSpace($env:WINGETCREATE_GITHUB_TOKEN)) {
            Write-Host "WINGETCREATE_GITHUB_TOKEN not configured; skipping Winget."
            exit 0
          }
          Invoke-WebRequest https://aka.ms/wingetcreate/latest -OutFile wingetcreate.exe
          $submitPath = Join-Path "winget-submit" "manifests/s/snapetech/slskr/${{ needs.metadata.outputs.pkgver }}"
          New-Item -ItemType Directory -Force $submitPath | Out-Null
          Copy-Item packaging/winget/snapetech.slskr.yaml $submitPath/
          Copy-Item packaging/winget/snapetech.slskr.installer.yaml $submitPath/
          Copy-Item packaging/winget/snapetech.slskr.locale.en-US.yaml $submitPath/
          $scriptRoot = if ($env:GITHUB_EVENT_NAME -eq 'workflow_dispatch') { 'release-publisher' } else { $env:GITHUB_WORKSPACE }
          $submitScript = Join-Path $scriptRoot 'scripts/submit-winget-release.ps1'
          & $submitScript `
            -WingetCreatePath (Join-Path $PWD 'wingetcreate.exe') `
            -SubmitPath $submitPath `
            -PackageVersion '${{ needs.metadata.outputs.pkgver }}'
