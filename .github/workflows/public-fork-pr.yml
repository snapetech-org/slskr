name: slskr fork PR validation
on:
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: public-fork-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: false
jobs:
  validate:
    name: Run disposable fork validation
    if: >-
      github.event.pull_request.head.repo.fork == true &&
      github.event.pull_request.base.repo.full_name == 'snapetech-org/slskr' &&
      github.event.pull_request.base.ref == 'main'
    permissions:
      contents: read
    uses: snapetech-org/slskr/.github/workflows/web-assets-validation.yml@713676d58f1601a8079257f3f4aeefdc0de7b7f6
