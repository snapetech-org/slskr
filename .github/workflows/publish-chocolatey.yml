# Runner policy: compatible GitHub-hosted runners by default
name: Publish Chocolatey
run-name: ${{ format('action:{0}:pool:{1}', inputs.action_tag, inputs.runner_pool_tag) }}

on:
  workflow_call:
    inputs:
      release_workflow_call:
        description: Validated tag handoff from the release workflow
        required: false
        type: boolean
        default: false
      action_tag:
        required: true
        type: string
      runner_pool_tag:
        required: true
        type: string
      tag:
        required: true
        type: string
      publish:
        required: false
        type: boolean
        default: true
      defer_initial_review:
        description: Owner-authorized pending exception; do not upload while the first package awaits approval
        required: false
        type: boolean
        default: false
    secrets:
      CHOCO_API_KEY:
        required: true
  workflow_dispatch:
    inputs:
      action_tag:
        description: Action to run
        required: true
        type: choice
        options:
          - release
      runner_pool_tag:
        description: GitHub-hosted runner pool
        required: true
        type: choice
        options: [hosted]
      tag:
        description: Release tag to publish
        required: true
      publish:
        description: Push the validated package to Chocolatey
        type: boolean
        default: true
        required: false
      defer_initial_review:
        description: Owner-authorized pending exception; do not upload while the first package awaits approval
        type: boolean
        default: false
        required: false

permissions:
  contents: read

jobs:
  publish:
    if: >-
      inputs.action_tag == 'release' && inputs.runner_pool_tag == 'hosted' &&
      (
        (inputs.release_workflow_call && github.ref == format('refs/tags/{0}', inputs.tag)) ||
        (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && !inputs.release_workflow_call)
      )
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Require publication credentials
        if: inputs.publish
        shell: pwsh
        env:
          CHOCO_API_KEY: ${{ secrets.CHOCO_API_KEY }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:CHOCO_API_KEY)) { throw 'CHOCO_API_KEY is required for publication' }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 1
      - name: Download release asset
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          gh release download $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY `
            --pattern 'slskr-*-x86_64-pc-windows-msvc.zip' `
            --pattern 'SHA256SUMS.txt' --dir release-assets
      - name: Verify release asset checksum
        shell: pwsh
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          $ErrorActionPreference = "Stop"
          $asset = @(Get-ChildItem release-assets\*.zip)
          if ($asset.Count -ne 1) {
            throw "Expected exactly one Windows release asset, found $($asset.Count)"
          }
          $checksumPath = Join-Path $PWD 'release-assets\SHA256SUMS.txt'
          if (-not (Test-Path $checksumPath)) {
            throw "SHA256SUMS.txt was not downloaded"
          }
          $escapedName = [regex]::Escape($asset[0].Name)
          $matches = @(Select-String -Path $checksumPath `
            -Pattern "^\s*([0-9a-fA-F]{64})\s+\*?(?:\./)?$escapedName\s*$")
          if ($matches.Count -ne 1) {
            throw "SHA256SUMS.txt does not contain one entry for $($asset[0].Name)"
          }
          $expected = $matches[0].Matches[0].Groups[1].Value.ToLowerInvariant()
          $actual = (Get-FileHash $asset[0].FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $expected) {
            throw "Checksum mismatch for $($asset[0].Name): expected $expected, got $actual"
          }
          Write-Host "Verified SHA256 for $($asset[0].Name)"
      - name: Resolve package version
        shell: pwsh
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          $ErrorActionPreference = "Stop"
          if ($env:RELEASE_TAG -notmatch '^(?:release-)?v(?<version>[0-9]+\.[0-9]+\.[0-9]+(?:[-+][0-9A-Za-z.-]+)?)$') {
            throw "Expected a v<semver> tag, got $env:RELEASE_TAG"
          }
          "PACKAGE_VERSION=$($Matches['version'])" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Render and pack Chocolatey artifact
        shell: pwsh
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          $asset = Get-ChildItem release-assets\*.zip | Select-Object -First 1
          $hash = (Get-FileHash $asset.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          $url = "https://github.com/$env:GITHUB_REPOSITORY/releases/download/$env:RELEASE_TAG/$($asset.Name)"
          (Get-Content packaging\chocolatey\tools\chocolateyinstall.ps1) `
            -replace '\$url\s*=\s*".*"', "`$url = `"$url`"" `
            -replace '\$checksum\s*=\s*".*"', "`$checksum = `"$hash`"" |
            Set-Content packaging\chocolatey\tools\chocolateyinstall.ps1
          $nuspecPath = 'packaging\chocolatey\slskr.nuspec'
          $nuspec = Get-Content $nuspecPath -Raw
          $nuspec = $nuspec -replace '<version>[^<]+</version>', "<version>$env:PACKAGE_VERSION</version>"
          Set-Content $nuspecPath $nuspec
          [xml]$manifest = Get-Content $nuspecPath -Raw
          $manager = [Xml.XmlNamespaceManager]::new($manifest.NameTable)
          $manager.AddNamespace('n', $manifest.DocumentElement.NamespaceURI)
          $metadata = $manifest.SelectSingleNode('/n:package/n:metadata', $manager)
          $dependencies = $metadata.SelectSingleNode('n:dependencies', $manager)
          $vc = $manifest.SelectSingleNode('//n:dependency[@id="vcredist140"]', $manager)
          $needsRuntime = [version](($env:PACKAGE_VERSION -split '[-+]')[0]) -lt [version]'0.2.84'
          if ($vc) { $null = $vc.ParentNode.RemoveChild($vc) }
          if ($needsRuntime) {
            if (-not $dependencies) {
              $dependencies = $manifest.CreateElement('dependencies', $manifest.DocumentElement.NamespaceURI)
              $null = $metadata.AppendChild($dependencies)
            }
            $vc = $manifest.CreateElement('dependency', $manifest.DocumentElement.NamespaceURI)
            $vc.SetAttribute('id', 'vcredist140')
            $vc.SetAttribute('version', '[14.0,)')
            $null = $dependencies.AppendChild($vc)
          } elseif ($dependencies -and -not $dependencies.HasChildNodes) {
            $null = $metadata.RemoveChild($dependencies)
          }
          $manifest.Save((Resolve-Path $nuspecPath).Path)
          choco pack packaging\chocolatey\slskr.nuspec --outputdirectory release-assets
      - name: Smoke-check nupkg contents
        shell: pwsh
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          $ErrorActionPreference = "Stop"
          $package = Get-ChildItem release-assets\*.nupkg | Select-Object -First 1
          if ($null -eq $package) {
            throw "Chocolatey pack did not produce an nupkg"
          }
          $extractDir = Join-Path $env:RUNNER_TEMP 'slskr-chocolatey-smoke'
          $archivePath = Join-Path $env:RUNNER_TEMP 'slskr-chocolatey-smoke.zip'
          Remove-Item $extractDir -Recurse -Force -ErrorAction SilentlyContinue
          Copy-Item $package.FullName $archivePath -Force
          Expand-Archive -Path $archivePath -DestinationPath $extractDir
          $installScript = Get-Content (Join-Path $extractDir 'tools\chocolateyinstall.ps1') -Raw
          [xml]$packedManifest = Get-Content (Get-ChildItem $extractDir -Filter '*.nuspec' | Select-Object -First 1).FullName -Raw
          $vc = $packedManifest.SelectSingleNode('//*[local-name()="dependency" and @id="vcredist140"]')
          $needsRuntime = [version](($env:PACKAGE_VERSION -split '[-+]')[0]) -lt [version]'0.2.84'
          if ($needsRuntime -ne ($null -ne $vc)) { throw 'Package Visual C++ runtime dependency does not match its binary generation' }
          $releaseUrlPattern = 'https://github\.com/[^/]+/[^/]+/releases/download/' + [regex]::Escape($env:RELEASE_TAG)
          if ($installScript -notmatch $releaseUrlPattern) {
            throw "nupkg installer does not contain a fully qualified release URL for $env:RELEASE_TAG"
          }
          if ($installScript -notmatch '\$checksum\s*=\s*"[0-9a-fA-F]{64}"') {
            throw "nupkg installer does not contain a SHA-256 checksum"
          }
      - name: Respect the pending first-package review
        if: inputs.publish && inputs.defer_initial_review
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          [xml]$first = (Invoke-WebRequest -Uri "https://community.chocolatey.org/api/v2/Packages(Id='slskr',Version='0.2.82')").Content
          $version = $first.SelectSingleNode("//*[local-name()='properties']/*[local-name()='Version']").InnerText
          $approved = $first.SelectSingleNode("//*[local-name()='properties']/*[local-name()='IsApproved']").InnerText
          if ($version -ne '0.2.82' -or $approved -notin @('true', 'false')) { throw 'Unexpected first-package moderation response' }
          if ($approved -eq 'false') {
            'CHOCO_DEFERRED=true' | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
            'Chocolatey awaits initial package approval. Owner authorized deferral; no upload or moderator contact will occur.' | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
          }
      - name: Record validated package evidence
        shell: pwsh
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          PUBLISH_REQUESTED: ${{ inputs.publish }}
        run: |
          $ErrorActionPreference = "Stop"
          $asset = Get-ChildItem release-assets\*.zip | Select-Object -First 1
          $package = Get-ChildItem release-assets\*.nupkg | Select-Object -First 1
          $sourceCommit = (git rev-parse HEAD).Trim()
          $receipt = [ordered]@{
            schemaVersion = 1
            evidenceMode = 'actual release asset; clean Windows package runner'
            tag = $env:RELEASE_TAG
            sourceCommit = $sourceCommit
            workflowSourceCommit = $env:GITHUB_SHA
            runUrl = "https://github.com/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID"
            assetName = $asset.Name
            assetSha256 = (Get-FileHash $asset.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            packageName = $package.Name
            packageSha256 = (Get-FileHash $package.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            releaseAssetChecksumVerified = $true
            packageUrlAndChecksumSmokePassed = $true
            publishRequested = ($env:PUBLISH_REQUESTED -eq 'true')
            pendingInitialReview = ($env:CHOCO_DEFERRED -eq 'true')
            publicationStatus = if ($env:CHOCO_DEFERRED -eq 'true') { 'pending-initial-review' } else { 'validated' }
          }
          $receipt | ConvertTo-Json | Set-Content release-assets\chocolatey-validation.json -Encoding utf8
      - name: Retain validated Chocolatey package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # actions/upload-artifact@v7.0.2
        with:
          name: chocolatey-validation-${{ github.run_id }}
          path: |
            release-assets/*.nupkg
            release-assets/chocolatey-validation.json
            release-assets/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
      - name: Push the validated package
        if: inputs.publish && env.CHOCO_DEFERRED != 'true'
        shell: pwsh
        env:
          CHOCO_API_KEY: ${{ secrets.CHOCO_API_KEY }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:CHOCO_API_KEY)) {
            throw "CHOCO_API_KEY is required for publication"
          }
          choco push (Get-ChildItem release-assets\*.nupkg | Select-Object -First 1) --source https://push.chocolatey.org/ --api-key $env:CHOCO_API_KEY
