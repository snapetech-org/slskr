name: Local Identity Leak Check

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  local-identity-leaks:
    runs-on: ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event_name == 'schedule') && github.ref == 'refs/heads/main' && fromJSON('{"group":"ng-shared-main-jit","labels":["self-hosted","linux","x64","ng-shared-main"]}') || 'ubuntu-latest' }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install scanner dependencies
        run: sudo apt-get update && sudo apt-get install -y jq ripgrep

      - name: Test rewritten-push history fallback
        run: bash scripts/test-check-local-identity-leaks.sh

      - name: Check release-facing text
        env:
          LOCAL_IDENTITY_DENYLIST: ${{ secrets.LOCAL_IDENTITY_DENYLIST }}
          LOCAL_IDENTITY_SCAN_COMMITS: "1"
          LOCAL_IDENTITY_SCAN_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: bash scripts/check-local-identity-leaks.sh
