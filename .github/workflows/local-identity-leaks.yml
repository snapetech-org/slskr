# Runner policy: compatible GitHub-hosted runners by default
name: Local Identity Leak Check
run-name: ${{ format('action:{0}:pool:{1}', inputs.action, inputs.runner_pool) }}

on:
  workflow_dispatch:
    inputs:
      action:
        description: Run the security scan
        required: true
        type: choice
        options:
          - scan
      runner_pool:
        description: Select the GitHub-hosted runner pool
        required: true
        type: choice
        options:
          - hosted
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  local-identity-leaks:
    if: >-
      (
        github.event_name != 'workflow_dispatch' ||
        (
          github.ref == 'refs/heads/main' &&
          inputs.action == 'scan' && inputs.runner_pool == 'hosted'
        )
      ) &&
      (
        github.event_name == 'workflow_dispatch' && inputs.action == 'scan' && inputs.runner_pool == 'hosted' && github.ref == 'refs/heads/main'
      )
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install scanner dependencies
        run: bash scripts/install-scanner-tools.sh

      - name: Test rewritten-push history fallback
        run: bash scripts/test-check-local-identity-leaks.sh

      - name: Check release-facing text
        env:
          LOCAL_IDENTITY_DENYLIST: ${{ secrets.LOCAL_IDENTITY_DENYLIST }}
          LOCAL_IDENTITY_SCAN_COMMITS: "1"
          LOCAL_IDENTITY_SCAN_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: bash scripts/check-local-identity-leaks.sh
